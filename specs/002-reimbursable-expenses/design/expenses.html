<script>
const SCREENS = ['Clients', 'New invoice', 'Add expense', 'Edit expense'];
const STATES = ['Seeded', 'Empty'];
const state = { s: 'Clients', st: 'Seeded', sz: 'Desktop', th: 'Dark' };

/* The seeded account (apps/web/src/mocks/fixtures.ts), 17 Sep 2026. */
const CLIENTS = [
  { id: 'byrne', name: 'Byrne Studio', rate: '$110.00/h', color: null, projects: [['Brand site rebuild', '$110.00/h', 'from client']] },
  { id: 'meridian', name: 'Meridian Labs', rate: '$125.00/h · default', color: '#A390DC', projects: [['Data pipeline audit', '$125.00/h', 'from default']] },
  { id: 'northwind', name: 'Northwind Trading', rate: '$150.00/h · ap@northwind.test', color: '#6EA1E2', projects: [['Rush: peak season fixes', '$195.00/h', 'own rate', true], ['Warehouse dashboard', '$150.00/h', 'from client']] },
];
/* kind: recurring = billed on every invoice, never leaves; waiting; billed = on an invoice not yet paid. Paid ones leave the card. */
const EXPENSES = {
  northwind: [
    { kind: 'recurring', desc: 'Claude Max subscription', date: '', amt: '$200.00' },
    { kind: 'waiting', desc: 'Figma license, annual', date: 'Aug 20', amt: '$180.00' },
  ],
  byrne: [{ kind: 'billed', desc: 'Stock photography', date: 'Aug 18', amt: '$75.00', on: 'STINT-0015' }],
  meridian: [],
};

const empty = () => state.st === 'Empty';
const expenses = (id) => (empty() ? [] : EXPENSES[id] || []);
const waiting = (id) => expenses(id).filter((e) => e.kind !== 'billed');
const pip = (c) => (c.color ? `<span class="dot" style="background:${c.color}"></span>` : '<span class="ring"></span>');
const sum = (rows) => '$' + rows.reduce((a, r) => a + Number(r.amt.replace(/[$,]/g, '')), 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const pencil = '<span class="subtle">✎</span>';

function frame(inner, nav, overlay = '') {
  const items = ['Home', 'Calendar', 'Clients', 'Invoices', 'Settings'];
  return `
  <div class="top"><span class="type-wordmark-small strong">|Stint|</span><span class="type-meta subtle">dev@localhost.test</span></div>
  <div class="body">
    <nav class="rail">${items.map((n) => `<a class="type-nav ${n === nav ? 'on' : ''}">${n.toUpperCase()}</a>`).join('')}</nav>
    <main class="content">${inner}</main>
  </div>
  <div class="timer"><span class="ring"></span><span class="input ph type-control">What are you working on?</span><span class="type-meta subtle">+ Project</span><span class="type-timer muted">0:00:00</span></div>
  ${overlay}`;
}

/* A project row, as on main (client-list.tsx Row). */
const projectRow = ([name, rate, src, own]) => `<div class="rowb">
  <span class="name"><span class="type-control strong">${name}</span></span>
  <span class="right"><span class="type-duration ${own ? '' : 'muted'}" style="display:block">${rate}</span><span class="src type-meta subtle" style="display:block">${src}</span></span>${pencil}</div>`;

/* An expense row: one line — name, its label, date, amount. */
const expenseRow = (e, lead = '') => `<div class="rowb one ${e.kind === 'billed' ? 'billed' : ''}">${lead}
  <span class="name"><span class="type-control strong">${e.desc}</span>${
    e.kind === 'recurring' ? '<span class="badge type-badge">↻ RECURRING</span>' : e.kind === 'billed' ? `<span class="badge type-badge">${e.on}</span>` : ''}</span>
  <span class="col-date type-meta">${e.date}</span>
  <span class="col-amt type-duration ${e.kind === 'billed' ? 'muted' : 'strong'}">${e.amt}</span>${lead ? '' : e.kind === 'billed' ? '<span class="subtle">→</span>' : pencil}</div>`;

function card(c) {
  const ex = expenses(c.id);
  return `<section class="card" style="box-shadow: inset 3px 0 0 ${c.color || 'var(--border-control)'}">
    <div class="hd"><span style="display:flex;padding-top:7px">${pip(c)}</span>
      <span style="flex:1;min-width:0"><span class="type-heading strong">${c.name}</span><br><span class="type-support subtle">${c.rate}</span></span>
      <span class="btn ghost type-control">✎ Edit</span></div>
    <div class="bd">${c.projects.map(projectRow).join('')}
      ${ex.length ? `<div class="exhead type-label">EXPENSES</div>${ex.map((e) => expenseRow(e)).join('')}` : ''}
      <div class="foot2"><span class="btn ghost type-support">+ Project</span><span class="btn ghost type-support">+ Expense</span></div></div>
  </section>`;
}
const clients = () => frame(`<div style="padding:4px 4px 0"><div class="ph"><span class="type-title strong">Clients</span><span class="btn type-control">+ Add client</span></div>
  ${CLIENTS.map(card).join('')}</div>`, 'Clients');

/* ─── New invoice ─── */
function newInvoice() {
  const w = waiting('northwind');
  const pick = w.length
    ? w.map((e) => expenseRow(e, '<span class="check on">✓</span>')).join('') + '<div class="foot2"><span class="btn ghost type-support">+ Expense</span></div>'
    : '<div class="foot2"><span class="btn ghost type-support">+ Expense</span></div>';
  const lines = [['Inventory sync edge cases', '9.00', '$195.00', '$1,755.00'], ['Filter panel and saved views', '6.00', '$150.00', '$900.00']];
  return frame(`<div class="panel"><span class="type-meta subtle">← INVOICES</span><div class="type-title strong" style="margin:6px 0 14px">New invoice</div>
    <div class="type-section strong">What to bill</div>
    <div class="field" style="margin-top:10px"><span class="type-label subtle">CLIENT *</span><span class="input type-control">Northwind Trading ▾</span></div>
    <div class="two" style="margin-top:10px"><div class="field"><span class="type-label subtle">FROM</span><span class="input type-control">09/01/2026</span></div><div class="field"><span class="type-label subtle">TO</span><span class="input type-control">09/30/2026</span></div></div>
    <div class="field" style="margin-top:14px"><span class="type-label subtle">EXPENSES</span><div style="padding:0 8px">${pick}</div></div>
    <div class="field" style="margin-top:14px"><span class="type-label subtle">CHARGES</span><span class="type-support subtle">+ Add a charge</span></div>
    <div style="margin-top:14px"><span class="btn type-control">Preview</span></div></div>
    <div class="panel"><div class="ph"><span class="type-section strong">Preview</span><span class="type-support subtle">Sep 1 – Sep 30, 2026</span></div>
    <div class="type-heading strong" style="margin:10px 0 2px">Northwind Trading · 11 entries</div>
    ${lines.map(([d, q, r, a]) => `<div class="irow"><span class="grow type-control">${d}</span><span class="type-duration muted" style="width:60px;text-align:right">${q}</span><span class="type-duration muted" style="width:80px;text-align:right">${r}</span><span class="amt type-duration" style="width:92px">${a}</span></div>`).join('')}
    ${w.length ? `<div class="type-label subtle" style="margin-top:14px">EXPENSES</div>${w.map((e) => `<div class="irow"><span class="grow type-control">${e.desc}</span><span class="type-duration muted" style="width:140px;text-align:right">${e.date ? e.date + ', 2026' : 'Sep 30, 2026'}</span><span class="amt type-duration" style="width:92px">${e.amt}</span></div>`).join('')}` : ''}
    <div class="totals type-support">${w.length ? `<div class="muted"><span>Services</span><span class="type-duration">$2,655.00</span></div><div class="muted"><span>Expenses</span><span class="type-duration">${sum(w)}</span></div>` : ''}
      <div class="t strong"><span>Total</span><span class="type-amount">${w.length ? '$3,035.00' : '$2,655.00'}</span></div></div>
    <div style="margin-top:16px"><span class="btn accent type-control">Generate invoice</span></div></div>`, 'Invoices');
}

/* ─── Dialogs, over Clients ─── */
const input = (label, val, ph) => `<div class="field"><span class="type-label subtle">${label}</span><span class="input ${ph ? 'ph' : ''} type-control">${val}</span></div>`;
function dialog(title, sub, fields, foot) {
  return clients() + `<div class="scrim"></div><div class="dialog">
    <div class="ph"><span class="type-section strong">${title}</span><span class="subtle">✕</span></div>
    <span class="type-support muted">${sub}</span>${fields}<div class="foot">${foot}</div></div>`;
}
const recurring = (on) => `<label class="type-control" style="display:flex;gap:8px;align-items:flex-start"><span class="check ${on ? 'on' : ''}" style="margin-top:2px">${on ? '✓' : ''}</span><span>Recurring<br><span class="type-support subtle">Billed on every invoice to Northwind Trading until unchecked.</span></span></label>`;
const expenseDialog = (title, v, action, del) => dialog(title, 'A cost Northwind Trading pays back.',
  input('DESCRIPTION *', v.desc || 'What was it for? Printed on the invoice.', !v.desc)
  + `<div class="two">${input('AMOUNT *', v.amt || '0.00', !v.amt)}${v.rec ? '' : input('DATE PAID *', v.date || '09/17/2026')}</div>`
  + recurring(v.rec) + input('NOTE', v.note || 'Receipt or order number. Not printed.', !v.note),
  `${del ? '<span class="btn ghost type-control danger">Delete</span>' : '<span></span>'}<span style="display:flex;gap:8px"><span class="btn ghost type-control">Cancel</span><span class="btn accent type-control">${action}</span></span>`);
const addExpense = () => expenseDialog('Add expense', {}, 'Add expense', false);
const editExpense = () => expenseDialog('Edit expense', { desc: 'Claude Max subscription', amt: '200.00', rec: true }, 'Save', true);
const NOTES = {
  Clients: 'A card lists its projects, then EXPENSES when it has any: recurring ones first, then what is waiting, then what sits on an unpaid invoice, muted with its number. A recurring expense never leaves; a one-off leaves once its invoice is paid. A row opens the expense dialog; a billed one-off opens its invoice, since it is locked.',
  'New invoice': 'Inputs in one card, the preview in its own. Every waiting and recurring expense is ticked; untick to leave one out of this invoice. A recurring expense is dated the period’s last day on the invoice.',
  'Add expense': 'One dialog for adding and editing. Recurring hides Date paid: it has no single date.',
  'Edit expense': 'The same dialog, opened by clicking a row. Delete stops a recurring expense; invoices that already billed it keep their line.',
};

function render() {
  const html = { Clients: clients, 'New invoice': newInvoice, 'Add expense': addExpense, 'Edit expense': editExpense }[state.s]();
  const app = document.getElementById('app');
  app.innerHTML = html;
  app.className = 'app' + (state.sz === 'Phone' ? ' phone' : '');
  document.documentElement.dataset.theme = state.th.toLowerCase();
  document.getElementById('note').innerHTML = NOTES[state.s];
  for (const [id, key, opts] of [['s', 's', SCREENS], ['st', 'st', STATES], ['sz', 'sz', ['Desktop', 'Phone']], ['th', 'th', ['Dark', 'Light']]]) {
    document.getElementById(id).innerHTML = opts.map((o) => `<button class="seg type-label ${state[key] === o ? 'on' : ''}" data-k="${key}" data-v="${o}">${o}</button>`).join('');
  }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]');
  if (!b) return;
  state[b.dataset.k] = b.dataset.v;
  render();
});
render();
</script>
</body>
</html>
