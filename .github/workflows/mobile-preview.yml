name: mobile-preview

# A PR's phone build: an Android APK pointed at the PR's Vercel preview and
# signed in on launch as pr-<n>@preview.test, built on EAS and linked on the
# PR for its Try it (`docs/mobile.md`, Preview builds). It installs as Stint
# Preview, beside the released app.
#
# Only when the app or a package it imports changes: EAS's free tier counts
# builds by the month.
#
# Requires, once: the EXPO_TOKEN and VERCEL_AUTOMATION_BYPASS_SECRET secrets,
# and the EAS_PROJECT_ID and EXPO_OWNER variables.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/mobile/**'
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/schema/**'
      - 'packages/design-tokens/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pull-requests: write

# A newer push supersedes a build still queued for the last one.
concurrency:
  group: mobile-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    # Dependabot's PRs cannot read secrets.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # EAS hands a cloud build its profile's `env` and nothing from this
      # shell, so the PR's values go into eas.json here, never into git.
      - name: Point the preview profile at this PR
        working-directory: apps/mobile
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # Vercel's branch alias, as preview-db.yml builds it.
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          host="stint-git-${slug}-blakeeriks-projects"
          if [ ${#host} -gt 63 ]; then
            echo "::error::Branch name too long for Vercel's alias; the build would have no preview to talk to."
            exit 1
          fi
          jq --arg pr "$PR" --arg url "https://${host}.vercel.app" --arg bypass "$BYPASS" \
             --arg project "$EAS_PROJECT_ID" --arg owner "$EXPO_OWNER" \
            '.build.preview.env += {
               STINT_PREVIEW_PR: $pr, STINT_APP_URL: $url, STINT_VERCEL_BYPASS: $bypass,
               EAS_PROJECT_ID: $project, EXPO_OWNER: $owner
             }' eas.json > eas.pr.json
          mv eas.pr.json eas.json

      - name: Build
        id: build
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          id=$(jq -r '.[0].id' build.json)
          echo "url=https://expo.dev/accounts/${EXPO_OWNER}/projects/stint/builds/${id}" >> "$GITHUB_OUTPUT"

      - name: Link it on the PR
        env:
          URL: ${{ steps.build.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="**Phone build** for ${SHA:0:7}: open ${URL} on your Android phone and tap Install. It opens as Stint Preview, signed in as pr-${PR}@preview.test."
          gh pr comment "$PR" --edit-last --create-if-none --body "$body"
