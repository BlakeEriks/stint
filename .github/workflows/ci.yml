name: CI

on:
  push: { branches: [main] }
  pull_request:
  # Run it on demand. `gh run rerun` is NOT a substitute: a re-run replays the
  # original run, keeping its creation time and its point-in-time view of the
  # caches — so re-running to check whether a newly-saved cache is now hit
  # reports a miss every time, which cost three misleading measurements.
  workflow_dispatch:

# The suite spins up five databases; a second push should supersede the
# first rather than run it all twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads code. Anything that needs more
# asks for it on the job.
permissions:
  contents: read

jobs:
  # Everything that needs no database, so an obvious slip reports in seconds
  # rather than behind a Postgres container.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` — package.json's `packageManager` pins it, and setting
      # both makes the action fail on a version mismatch.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      # Next's build cache. `restore-keys` IS wanted here, unlike the Supabase
      # images: a previous build's cache is a genuine head start, since Next
      # revalidates what changed.
      #
      # Keyed on the source it compiles, so an unchanged tree restores exactly
      # and a changed one falls back to the newest prefix match.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/*/src/**') }}
          restore-keys: |
            next-${{ hashFiles('pnpm-lock.yaml') }}-
            next-

      - name: Lint
        run: pnpm lint

      # Generated token files must match tokens.json. A hand-edit to one of
      # them fails here rather than drifting silently across three clients.
      #
      # The diff names the three generated files that are COMMITTED. Most of
      # the generator's output lands in packages/design-tokens/dist/, which is
      # gitignored — diffing that path can only ever report nothing, so the
      # check that pointed there passed on a tampered file. These three are
      # written outside dist/ precisely because their consumers (SwiftPM,
      # Next's icon convention, a docs page opened from disk) cannot read an
      # ignored directory; being tracked is what makes them checkable.
      - name: Design tokens are up to date
        run: |
          pnpm tokens
          git diff --exit-code \
            apps/macos/Sources/Stint/Tokens.swift \
            apps/web/src/app/icon.svg \
            docs/design/screens/_mockup.css

      # Guards white-on-accent (1.37:1) and the AA floors, and re-derives both
      # neutral ramps so a hand-edited hex fails naming its step.
      - name: Contrast contract
        run: pnpm tokens:validate

      # Vendored shadcn components are rewritten to our tokens at install.
      # This is the only enforcement: Tailwind 4 drops an unknown utility
      # with no warning and exit 0, so a surviving `bg-primary` would render
      # our neutral grey on a primary button and never fail the build.
      - name: shadcn components use our tokens
        run: pnpm --filter @stint/web detox

      # Same silence as above: `text-[13.5px]` compiles happily and a typo'd
      # `type-lable` compiles to nothing at all, so neither fails the build.
      - name: Typography uses the scale
        run: pnpm --filter @stint/web check:type

      - name: Typecheck
        run: |
          npx tsc --noEmit -p tsconfig.json
          pnpm --filter @stint/web typecheck

      # Component tests: jsdom, no database. The route/RLS suites run under
      # `node --test` against real Postgres in the `database` job.
      - name: UI component tests
        run: pnpm --filter @stint/web test:ui

      - name: Core logic tests
        run: node --test --experimental-strip-types packages/core/test/*.test.ts

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: pnpm --filter @stint/web build

  # Applies the real migrations, then runs the real route handlers against
  # them, so the timer index and immutability triggers are genuinely exercised.
  database:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tt
        # 5432 is what every step below connects on. 54322 is the SAME
        # container on a second host port, for `seed-account.mjs` alone: that
        # script refuses any connection that is not the local Supabase stack's
        # `localhost:54322`, and the guard is the point of it — a seeder that
        # can be pointed at production is a seeder that eventually is. Mapping
        # a second port is cheaper than teaching the guard about CI.
        ports: ['5432:5432', '54322:5432']
        # `--health-interval 1s`, not the usual 10s. The runner polls on its
        # own backoff (2s, 3s, 7s) and only stops at the first probe that
        # reports healthy, so a slow interval is spent waiting on a Postgres
        # that is already up: measured 13.6s of a 19s step, against ~2s for
        # the container to actually start. The probe is `pg_isready` against a
        # local socket — running it every second costs nothing.
        options: >-
          --health-cmd pg_isready --health-interval 1s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      - name: The route-test database
        run: bash scripts/ci-db.sh tt

      - name: API route tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tt
        run: pnpm --filter @stint/web test

      # The seeder runs in no other job, so a rename in a migration breaks it
      # silently and the next developer to run `pnpm seed` finds it. Both
      # halves run: `--clear` is the half that only executes once there is
      # something to remove, and it is the half that deletes, so it is the
      # half worth exercising. The email is a throwaway — the script creates
      # the account, and this database is destroyed with the runner.
      #
      # `localhost:54322`, not the `:5432` above: same container, and the
      # script accepts no other address. `tt` is the route-test database,
      # already migrated, and the seeder only ever touches rows it tagged.
      # The account is created HERE, not by the seeder. `ci-db.sh` stubs
      # auth.users with the two columns the grants migration needs, while the
      # seeder's own create path writes the dozen a real GoTrue table has
      # (instance_id, encrypted_password, the token columns) and fails on the
      # stub. Pre-inserting the row sends it down its find-existing path, which
      # is the path a developer with an account takes anyway — and leaves the
      # scenario building, the rollups and `--clear` as what this exercises.
      - name: The account seeder still runs
        env:
          PGPASSWORD: postgres
          SEED_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/tt
        run: |
          psql -h localhost -p 5432 -U postgres -d tt -v ON_ERROR_STOP=1 \
            -c "insert into auth.users (id, email)
                values (gen_random_uuid(), 'ci-seed-check@localhost.test')"
          pnpm seed ci-seed-check@localhost.test
          pnpm seed ci-seed-check@localhost.test --clear

      # A SEPARATE database: the route tests above disable RLS on theirs. Here
      # RLS stays on and the caller is a non-superuser role, so auth.uid()
      # resolves and the policies actually run.
      - name: The RLS database
        run: bash scripts/ci-db.sh tt_rls --rls

      - name: RLS tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tt_rls
          RLS_DATABASE_URL: postgresql://authenticated:test@localhost:5432/tt_rls
        run: pnpm --filter @stint/web test:rls

      # Run against the RLS database, the one where RLS is still ON. Catches a
      # migration creating a table without RLS, or with RLS but no policy,
      # before it reaches a real project.
      - name: Schema is sound
        run: pnpm verify:schema --url postgresql://postgres:postgres@localhost:5432/tt_rls

  # The menu bar app, and the only check it has. Billed at 10x a Linux minute,
  # which buys a compile error surfacing here rather than in the terminal of
  # whoever next runs `bundle.sh`.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      # Tokens.swift is generated. Building the committed copy compiles
      # whatever was last pasted in, so a tokens.json change that emits Swift
      # this compiler rejects passes here and fails on the next developer's
      # `bundle.sh`. Regenerating first makes this job the check it claims to
      # be. The `static` job catches the drift; this one catches the emit.
      - run: pnpm tokens

      - name: Build the menu bar app
        run: cd apps/macos && swift build

  # The browser suite, in its own job because it needs the whole Supabase
  # stack — GoTrue to issue magic links, Mailpit to catch them — and because
  # it is the slowest, so a lint or type failure reports without waiting
  # behind a Docker pull.
  #
  # The only suite that exercises the browser: cookies, navigation, redirects
  # and server components. Route tests never render, and jsdom's fetch is a
  # stub that agrees with the component.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # The images are PULLED, not cached, and that is deliberate.
      #
      # Caching them was tried and measured, and it made the job slower:
      # restoring cost 7s to download plus **38s for `docker load`** against a
      # pull of 18s once the unused images were dropped. `docker load` decodes
      # a tarball serially on a slow runner disk; a pull fetches layers in
      # parallel and skips that entirely. Net ~20s WORSE per run.
      #
      # Do not reintroduce it without measuring on a runner. `docker load` took
      # 6s locally and 38s in CI, which is the trap — extrapolating from a
      # laptop is what made it look like a win.
      #
      # What remains is a real exposure: `public.ecr.aws` rate-limits anonymous
      # pulls, and a run hit `toomanyrequests` on four images at once. The CLI
      # retried with backoff and survived. If that starts failing rather than
      # retrying, the fix is a registry mirror or an authenticated pull, not a
      # tarball in the Actions cache.
      #
      # WITHOUT Studio or postgres-meta: the browser suite drives the app,
      # never the dashboard, and they are 2.25GB of the 4.4GB of images. Took
      # the e2e job from 198s to ~150s.
      - name: Start Supabase
        run: npx supabase start -x studio,postgres-meta

      # The Playwright version alone is the key: browser builds are pinned to
      # it. Read from the installed package rather than hashing the lockfile,
      # which would throw away a still-valid browser on every unrelated
      # dependency change.
      #
      # Worth caching where the Supabase images are not: this restores a plain
      # directory, with no `docker load` decode step.
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ steps.pw.outputs.v }}

      # `--only-shell`: the suite runs headless, and the shell is 195MB
      # against full Chrome's 359MB. See the `channel` note in
      # playwright.config.ts for what it gives up.
      #
      # NO `--with-deps`: it apt-gets libraries `ubuntu-latest` already
      # carries, into /usr/lib where the cache cannot reach — the whole cost
      # of this step on a cache hit. The runner image is what makes that safe,
      # and what could silently take it away.
      - name: Install Chromium
        run: cd apps/web && npx playwright install --only-shell chromium

      # A missing system library fails HERE, naming itself, rather than as ten
      # opaque timeouts inside the suite. This is what makes dropping
      # `--with-deps` diagnosable.
      - name: The browser launches
        run: cd apps/web && node -e "require('@playwright/test').chromium.launch().then(b=>b.close())"

      # The dev server reads .env.development.local, which is gitignored
      # because it holds a local-only key. CI writes its own from what
      # `supabase start` just printed.
      - name: Point the app at the local stack
        run: |
          cd apps/web
          KEY=$(npx supabase status -o json | node -e \
            "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).PUBLISHABLE_KEY))")
          cat > .env.development.local <<ENV
          NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$KEY
          ENV

      - name: Start the app
        run: |
          cd apps/web
          pnpm dev > /tmp/dev.log 2>&1 &
          # Poll rather than sleep: the first `next dev` compile is slow and
          # variable, and a fixed wait is either flaky or wasted time.
          for i in $(seq 1 90); do
            curl -fsS http://localhost:3100/signin > /dev/null && exit 0
            sleep 1
          done
          echo "The app did not come up:"; cat /tmp/dev.log; exit 1

      - name: End-to-end tests
        run: cd apps/web && pnpm test:e2e

      # The trace and screenshots are what make a CI-only failure diagnosable.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/test-results/
            /tmp/dev.log
          retention-days: 7
