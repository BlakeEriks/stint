name: mobile-preview

# The phone's previews (`docs/mobile.md`, Preview builds): one development
# build of Stint Preview, which the reviewer installs once, and an EAS Update
# per PR that the build opens from a QR on the PR. The update carries the
# PR's number and Vercel preview; the build carries neither, so its
# fingerprint changes only with native code, and only then does it build.
#
# Expo's continuous-deploy-fingerprint action runs these same commands, but
# finds its comment by a marker anyone can type, and publishes on main too,
# where there is no PR for the update to talk to.
#
# The link is public, so neither holds a secret: the reviewer types Vercel's
# bypass into the app once (`apps/mobile/src/bypass.ts`).
#
# Requires, once: the EXPO_TOKEN secret, and the EAS_PROJECT_ID and
# EXPO_OWNER variables.
on:
  # Main keeps the shared build current, so a PR rarely builds its own.
  push:
    branches: [main]
    paths: &app
      - 'apps/mobile/**'
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/schema/**'
      - 'packages/design-tokens/**'
      - 'pnpm-lock.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths: *app

permissions:
  contents: read
  pull-requests: write

# A newer push supersedes the last one's run.
concurrency:
  group: mobile-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    # Dependabot's PRs cannot read secrets.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # Pinned: this step holds the Expo token.
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      # EAS hands a cloud build its profile's `env` and nothing from this
      # shell, so the project's values go into eas.json here, never into git.
      # The shell gets the profile's `env` too: the fingerprint reads
      # app.config.ts here, and must see what the build saw.
      - name: Point the preview profile at the project
        working-directory: apps/mobile
        run: |
          jq --arg project "$EAS_PROJECT_ID" --arg owner "$EXPO_OWNER" \
            '.build.preview.env += { EAS_PROJECT_ID: $project, EXPO_OWNER: $owner }' \
            eas.json > eas.pr.json
          mv eas.pr.json eas.json
          jq -r '.build.preview.env | to_entries[] | "\(.key)=\(.value)"' eas.json >> "$GITHUB_ENV"

      # A finished build with this fingerprint runs this push's JavaScript;
      # one that expires within a day can no longer be installed from its link.
      - name: Build, if no build runs this native code
        id: build
        working-directory: apps/mobile
        run: |
          fingerprint=$(npx expo-updates fingerprint:generate --platform android | jq -r .hash)
          build=$(eas build:list --platform android --build-profile preview \
              --runtime-version "$fingerprint" --status finished \
              --limit 1 --json --non-interactive \
            | jq -r '[.[] | select(.expirationDate > (now + 86400 | todate))][0].id // empty')
          if [ -n "$build" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            eas build --platform android --profile preview --non-interactive --wait --json > build.json
            build=$(jq -r '.[0].id' build.json)
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          echo "url=https://expo.dev/accounts/${EXPO_OWNER}/projects/stint/builds/${build}" >> "$GITHUB_OUTPUT"

      # Only the update knows the PR: the build serves every PR.
      - name: Publish this PR's update
        id: update
        if: github.event_name == 'pull_request'
        working-directory: apps/mobile
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A long branch has no preview for the update to talk to.
          STINT_APP_URL=$(node ../../scripts/preview-url.mjs "$BRANCH")
          export STINT_APP_URL STINT_PREVIEW_PR="$PR"
          # The bundle imports the tokens, which git doesn't carry.
          pnpm --filter @stint/design-tokens build
          group=$(eas update --branch "pr-$PR" --platform android --environment preview \
              --message "${SHA:0:7}" --non-interactive --json \
            | jq -r '.[0].group')
          echo "qr=https://qr.expo.dev/eas-update?appScheme=stint&projectId=${EAS_PROJECT_ID}&groupId=${group}" >> "$GITHUB_OUTPUT"
          echo "url=https://expo.dev/projects/${EAS_PROJECT_ID}/updates/${group}" >> "$GITHUB_OUTPUT"

      - name: Link it on the PR
        if: github.event_name == 'pull_request'
        env:
          NEW: ${{ steps.build.outputs.new }}
          BUILD: ${{ steps.build.outputs.url }}
          QR: ${{ steps.update.outputs.qr }}
          UPDATE: ${{ steps.update.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        # By its marker, and only the bot's: `--edit-last` would take whichever
        # comment the bot wrote last, such as doc drift's, and anyone can type
        # the marker.
        run: |
          install="install Stint Preview from ${BUILD} on your Android phone. On its first launch, paste Vercel's bypass."
          open="Then scan this with the phone's camera: Stint Preview opens this PR, signed in as pr-${PR}@preview.test (or open ${UPDATE}).

          ![Scan to open this PR](${QR})"
          if [ "$NEW" = true ]; then
            scan="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=$(jq -rn --arg u "$BUILD" '$u | @uri')"
            body="<!-- mobile-preview -->
          **Phone preview** for ${SHA:0:7}: no build ran this push's native code, so it has a new one. Scan this to ${install}

          ![Scan to install](${scan})

          ${open}"
          else
            body="<!-- mobile-preview -->
          **Phone preview** for ${SHA:0:7}: this push needed no new build. No Stint Preview yet, or it won't open this PR: ${install}

          ${open}"
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- mobile-preview -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
