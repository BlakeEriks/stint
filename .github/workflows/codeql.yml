name: CodeQL

# Catches the injection and data-flow classes that typecheck and the unit
# suite structurally cannot — this app builds SQL filters and renders
# user-supplied strings into PDFs.
#
# DORMANT while the repo is private: code scanning needs GitHub Advanced
# Security, and without it every run scans all 123 files and then fails on
# upload with "Code scanning is not enabled for this repository". A check
# that is permanently red is worse than no check, so it only runs where it
# can succeed — a public repo, or a private one with Advanced Security.
#
# Nothing to change to turn it on: making the repo public is enough.
on:
  pull_request:
  schedule:
    # Monday early, so a new advisory surfaces before the week's work.
    - cron: '17 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning is free on public repos; on private ones it needs
    # Advanced Security. Skip rather than fail where it cannot upload.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # CodeQL reads its own workflow run to attach results and telemetry.
      # Without this every run scans successfully and then fails with
      # "Resource not accessible by integration".
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Includes the security-and-quality suite, not just the default.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
