name: CI

on:
  push: { branches: [main] }
  pull_request:
  # Run it on demand. `gh run rerun` is NOT a substitute: a re-run replays the
  # original run, keeping its creation time and its point-in-time view of the
  # caches — so re-running to check whether a newly-saved cache is now hit
  # reports a miss every time, which cost three misleading measurements.
  workflow_dispatch:

# The suite spins up five databases; a second push should supersede the
# first rather than run it all twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads code. Anything that needs more
# asks for it on the job.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tt
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7
      # No `version:` — package.json's `packageManager` pins it, and setting
      # both makes the action fail on a version mismatch.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      # Formatting and lint. Fast enough to run first, so an obvious slip
      # fails in seconds rather than after five databases have spun up.
      - name: Lint
        run: pnpm lint

      # Generated token files must match tokens.json. A hand-edit to dist/
      # fails here rather than drifting silently across three clients.
      - name: Design tokens are up to date
        run: |
          node packages/design-tokens/src/generate.js
          git diff --exit-code packages/design-tokens/dist

      # Guards the white-on-accent regression (1.37:1) and the AA floors.
      - name: Contrast contract
        run: node packages/design-tokens/src/validate.js

      # Vendored shadcn components are rewritten to our tokens at install.
      # This is the only enforcement: Tailwind 4 drops an unknown utility
      # with no warning and exit 0, so a surviving `bg-primary` would render
      # our neutral grey on a primary button and never fail the build.
      - name: shadcn components use our tokens
        run: cd apps/web && node scripts/shadcn-detox.mjs --check 'src/components/ui/*.tsx'

      # Typography comes from the scale, never assembled at the call site.
      # Same silence as above: `text-[13.5px]` compiles happily and a typo'd
      # `type-lable` compiles to nothing at all, so neither shows up as a
      # build failure. The app had accumulated twelve arbitrary font sizes
      # before this existed.
      - name: Typography uses the scale
        run: cd apps/web && pnpm check:type

      - name: Typecheck
        run: |
          npx tsc --noEmit -p tsconfig.json
          cd apps/web && npx tsc --noEmit

      # Component tests: jsdom, no database. The route/RLS suites below run
      # under `node --test` against real Postgres and are separate.
      - name: UI component tests
        run: cd apps/web && pnpm test:ui

      - name: Core logic tests
        run: node --test --experimental-strip-types packages/core/test/*.test.ts

      # Applies the real migrations, then runs the real route handlers
      # against them — so the timer index and immutability triggers are
      # genuinely exercised, not mocked.
      - name: Apply migrations
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -d tt -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table auth.users (id uuid primary key default gen_random_uuid(), email text);
          create or replace function auth.uid() returns uuid language sql stable as
            $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          -- Supabase ships these; the grants migration needs them to exist.
          -- Roles are CLUSTER-wide, so the RLS database below must not
          -- recreate them — it only upgrades `authenticated` to log in.
          create role anon nologin;
          create role authenticated nologin;
          SQL
          for f in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d tt -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d tt -c "
            alter table user_settings disable row level security;
            alter table clients disable row level security;
            alter table projects disable row level security;
            alter table invoices disable row level security;
            alter table time_entries disable row level security;
            alter table invoice_line_items disable row level security;
            alter table payment_profiles disable row level security;"

      - name: API route tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tt
        run: cd apps/web && pnpm test

      # A SEPARATE database, because the route tests above disable RLS on
      # theirs. Here RLS stays on and the caller is a non-superuser role, so
      # auth.uid() resolves and the policies actually run.
      - name: Set up the RLS database
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -c 'create database tt_rls'
          psql -h localhost -U postgres -d tt_rls -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table auth.users (id uuid primary key default gen_random_uuid(), email text);
          create or replace function auth.uid() returns uuid language sql stable as
            $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          -- anon/authenticated already exist from the first database: roles
          -- are cluster-wide, and re-creating them fails the step.
          --
          -- `authenticated` mirrors the role PostgREST uses for a signed-in
          -- caller, so it needs to log in here — NOT a superuser and NOT
          -- BYPASSRLS, or every assertion passes vacuously.
          alter role authenticated login password 'test';
          SQL
          for f in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d tt_rls -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d tt_rls -v ON_ERROR_STOP=1 <<'SQL'
          grant usage on schema public, auth to authenticated;
          grant select on auth.users to authenticated;
          grant execute on all functions in schema public, auth to authenticated;
          -- Table privileges come from 00000000000004_api_grants.sql, not from
          -- here: granting them ad-hoc would hide a broken grants migration.
          SQL

      - name: RLS tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tt_rls
          RLS_DATABASE_URL: postgresql://authenticated:test@localhost:5432/tt_rls
        run: cd apps/web && pnpm test:rls

      # The same assertions that gate a production release, run here against
      # the RLS database — the one where RLS is still ON. Catches a migration
      # that creates a table without RLS, or with RLS but no policy, before
      # it can reach a real project.
      - name: Schema is sound
        run: pnpm verify:schema --url postgresql://postgres:postgres@localhost:5432/tt_rls

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: cd apps/web && pnpm build

  # The browser suite, in its own job because it needs the whole Supabase
  # stack — GoTrue to issue magic links and Mailpit to catch them — not the
  # bare Postgres service the job above uses. It is also the slowest, and
  # keeping it separate means a lint or type failure reports in seconds
  # rather than waiting behind a Docker pull.
  #
  # This is the only suite that exercises the browser: cookies, navigation,
  # redirects and server components. It was added after a bug where every
  # invoice detail page threw — the route returned the invoice flat while the
  # client expected it nested — which the other three suites structurally
  # could not catch, because route tests never render and jsdom's fetch is a
  # stub that agreed with the component.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # The images are PULLED, not cached, and that is deliberate.
      #
      # Caching them was tried and measured, and it made the job slower:
      # restoring cost 7s to download plus **38s for `docker load`** against a
      # pull of 18s once the unused images were dropped. `docker load` decodes
      # a tarball serially on a slow runner disk; a pull fetches layers in
      # parallel and skips that entirely. Net ~20s WORSE per run.
      #
      # Do not reintroduce it without measuring on a runner. `docker load` took
      # 6s locally and 38s in CI, which is the trap — extrapolating from a
      # laptop is what made it look like a win.
      #
      # What remains is a real exposure: `public.ecr.aws` rate-limits anonymous
      # pulls, and a run hit `toomanyrequests` on four images at once. The CLI
      # retried with backoff and survived. If that starts failing rather than
      # retrying, the fix is a registry mirror or an authenticated pull, not a
      # tarball in the Actions cache.
      #
      # WITHOUT Studio or postgres-meta. Studio is the local dashboard and
      # postgres-meta is its backend; the browser suite drives the app, never
      # the dashboard, so CI was pulling 2.25GB it does not use — over half the
      # total image weight. This took the e2e job from 198s to ~150s and is
      # where the actual saving came from.
      #
      # `pnpm dev:up` deliberately does NOT exclude them: Studio on :54323 is
      # useful while developing. This is a CI-only narrowing.
      - name: Start Supabase
        run: npx supabase start -x studio,postgres-meta

      # The Playwright version alone is the key: browser builds are pinned to
      # it, so a lockfile bump is the only thing that invalidates them. Read
      # from the installed package rather than hashing a file — hashing the
      # lockfile would throw away a still-valid browser on every unrelated
      # dependency change, the same trap the Supabase image key had.
      #
      # Unlike the Supabase images, this one is worth caching: it restores a
      # plain directory. That cache lost to a pull because `docker load`
      # decodes a tarball serially; there is no decode step here.
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ steps.pw.outputs.v }}

      # `--only-shell`: the suite runs headless, and the shell is 195MB
      # against full Chrome's 359MB — plus it launches faster, which is a
      # per-launch saving rather than a per-run one. See the `channel` note in
      # playwright.config.ts for what this gives up (nothing we use).
      #
      # `--with-deps` runs apt-get for system libraries, which the cache does
      # NOT cover — those land in /usr/lib, not ~/.cache. So it must run on a
      # hit too; it is seconds when the packages are already present.
      - name: Install Chromium
        run: cd apps/web && npx playwright install --with-deps --only-shell chromium

      # The dev server reads .env.development.local, which is gitignored
      # because it holds a local-only key. CI writes its own from what
      # `supabase start` just printed.
      - name: Point the app at the local stack
        run: |
          cd apps/web
          KEY=$(npx supabase status -o json | node -e \
            "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).PUBLISHABLE_KEY))")
          cat > .env.development.local <<ENV
          NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$KEY
          ENV

      - name: Start the app
        run: |
          cd apps/web
          pnpm dev > /tmp/dev.log 2>&1 &
          # Poll rather than sleep: the first `next dev` compile is slow and
          # variable, and a fixed wait is either flaky or wasted time.
          for i in $(seq 1 90); do
            curl -fsS http://localhost:3100/signin > /dev/null && exit 0
            sleep 1
          done
          echo "The app did not come up:"; cat /tmp/dev.log; exit 1

      - name: End-to-end tests
        run: cd apps/web && pnpm test:e2e

      # The trace and screenshots are what make a CI-only failure
      # diagnosable; without them a red run is just a name.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/test-results/
            /tmp/dev.log
          retention-days: 7
