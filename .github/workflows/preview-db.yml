name: preview-db

# Keeps stint-test — the database every Vercel preview reads — in step with
# the open PRs, and gives each PR its own seeded account, pr-<n>@preview.test,
# which `/preview/signin?pr=<n>` signs a reviewer into. A `Preview accounts:
# first-signin` line in the PR body adds pr-<n>-first-signin@preview.test,
# seeded in that scenario, which `&as=first-signin` signs into
# (`scripts/preview-seed.sh`).
#
# The previews share one schema, so it belongs to the holder: the open PR
# labeled `ready-for-qa` whose diff touches supabase/migrations
# (`/work-issues` gives that label to one such PR at a time, by the same
# diff, whatever its other labels, and `migration-handoff.yml` passes it on
# when the holder merges). Any other PR
# whose diff touches supabase/migrations is neither reset nor seeded, since
# its tables are not there.
#
# Every other run seeds its PR's account from that branch. It first rebuilds
# the schema — empty, migrate, reseed every open PR — when:
#   - the holder's diff touches supabase/migrations
#   - the checkout holds a migration stint-test has not applied
#   - stint-test has applied a migration neither the holder nor this
#     checkout holds: a PR closed unmerged, one that dropped its migration,
#     or a holder that lost the database to the next
#   - it is run by hand
# Both state checks mean a run superseded in the queue, or one that failed
# midway, is repaired by whichever run comes next.
#
# Requires PREVIEW_DB_URL — stint-test's session pooler string — as a secret
# on the Preview environment.
on:
  pull_request:
    # `edited`: the body names the scenario accounts to seed. `labeled`:
    # `ready-for-qa` hands a migration PR the database.
    types: [opened, synchronize, reopened, edited, closed, labeled]
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Named, so steps run with pipefail too: a bare `run` is `bash -e` alone,
# and a failed `gh` feeding a pipe or a `for` list would pass silently.
defaults:
  run:
    shell: bash

jobs:
  preview-db:
    # Dependabot's PRs cannot read secrets, and their previews need no account.
    # A PR merged into main is handled by the push it makes. An edit reseeds
    # only an open PR's changed body: a title edit would reset a reviewer's
    # accounts for nothing, and a closed PR's merge ref is stale. A label
    # matters only when it can make a migration PR the holder.
    if: >-
      github.actor != 'dependabot[bot]' &&
      !(github.event.action == 'closed' && github.event.pull_request.merged) &&
      (github.event.action != 'edited' ||
        (github.event.pull_request.state == 'open' && github.event.changes.body)) &&
      (github.event.action != 'labeled' ||
        github.event.label.name == 'ready-for-qa')
    # One at a time: a reset racing a seed leaves an account half-written.
    # On the job, not the workflow, so a run its `if` skips never queues:
    # a group keeps one waiting run, and a skipped one would cancel it.
    concurrency:
      group: preview-db
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: Preview
      # The branch's preview, so this job's entry on the PR links where
      # Vercel's does.
      url: ${{ steps.plan.outputs.url }}
    env:
      SUPABASE_DB_URL: ${{ secrets.PREVIEW_DB_URL }}
      SEED_DATABASE_URL: ${{ secrets.PREVIEW_DB_URL }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      CLOSED: ${{ github.event.action == 'closed' }}
    steps:
      # An open PR checks out its merge with main, so `HEAD^1` is main and the
      # schema applied is main's plus the PR's. A closed one has no merge ref
      # and goes back to main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.action == 'closed' && 'main' || '' }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: '24', cache: 'pnpm' }
      # The scripts need only `pg`, and this job holds a database string.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Plan
        id: plan
        env:
          BRANCH: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
          HOLDER: ${{ contains(github.event.pull_request.labels.*.name, 'ready-for-qa') }}
        run: |
          # One collation for both lists, or `comm` misreads them.
          export LC_ALL=C

          migrates=false
          if [ -n "$PR" ] && [ "$CLOSED" != true ] &&
             ! git diff --quiet HEAD^1 HEAD -- supabase/migrations; then
            migrates=true
          fi
          if [ "$migrates" = true ] && [ "$HOLDER" != true ]; then
            echo "::notice::Not the preview database's holder: no reset, no account."
            echo "seed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "seed=true" >> "$GITHUB_OUTPUT"

          applied=$(node scripts/preview-reset.mjs --applied)
          files=$(ls supabase/migrations | grep '\.sql$' | sort)
          missing=$(comm -23 <(echo "$files") <(echo "$applied"))
          extra=$(comm -13 <(echo "$files") <(echo "$applied"))

          # An extra migration is kept only while the holder has it; any
          # other orphans the schema. Assigned, not inlined in the `for`, so
          # a failed `gh` stops the step instead of reading as "no holder"
          # and wiping every account.
          held=""
          if [ -n "$extra" ]; then
            branches=$(gh pr list --state open --label ready-for-qa \
              --json headRefName -q '.[].headRefName')
            for branch in $branches; do
              git fetch --quiet --depth 1 origin "$branch"
              for f in $extra; do
                if git cat-file -e "FETCH_HEAD:supabase/migrations/$f" 2>/dev/null; then
                  held="$held $f"
                fi
              done
            done
          fi
          orphaned=false
          for f in $extra; do
            case " $held " in *" $f "*) ;; *) orphaned=true ;; esac
          done

          reset=false
          if [ "$EVENT" = workflow_dispatch ] || [ -n "$missing" ] || [ "$orphaned" = true ]; then
            reset=true
          elif [ "$migrates" = true ]; then
            reset=true
          fi
          echo "reset=$reset" >> "$GITHUB_OUTPUT"

          # A long branch gets no link rather than a wrong one.
          if [ -n "$PR" ] && [ "$CLOSED" != true ]; then
            if url=$(node scripts/preview-url.mjs "$BRANCH"); then
              echo "url=$url" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Branch name too long for Vercel's alias; Try it needs the deployment URL."
            fi
          fi

      - name: Rebuild the schema
        if: steps.plan.outputs.reset == 'true'
        run: |
          node scripts/preview-reset.mjs
          pnpm migrate

      - name: Seed this PR's account
        if: env.PR != '' && env.CLOSED != 'true' && steps.plan.outputs.seed == 'true'
        run: bash scripts/preview-seed.sh "$PR"

      # A reset deleted every account, so each open PR is reseeded from its
      # own branch's seed, which may carry data this one does not. A
      # migration PR that is not the holder has no tables to seed into.
      - name: Reseed the other open PRs
        if: steps.plan.outputs.reset == 'true'
        run: |
          gh pr list --state open --json number,headRefName,labels,files -q '.[] |
              select(any(.labels[]; .name == "ready-for-qa") or
                all(.files[]; .path | startswith("supabase/migrations/") | not)) |
              "\(.number) \(.headRefName)"' |
          while read -r n branch; do
            [ "$n" = "$PR" ] && continue
            git fetch --quiet --depth 1 origin "$branch" || continue
            git show FETCH_HEAD:scripts/seed-account.mjs > "scripts/.seed-pr-$n.mjs" || continue
            bash scripts/preview-seed.sh "$n" "scripts/.seed-pr-$n.mjs" \
              || echo "::warning::Could not reseed PR #$n — re-run its preview-db check."
          done
