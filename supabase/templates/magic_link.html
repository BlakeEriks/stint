<!--
  The sign-in email.

  It carries BOTH a code and a link, because they serve different clients: the
  macOS app takes the code (a link cannot cross from a browser into another
  application without going through the clipboard or a URL scheme a browser
  will not follow), and the web app takes the link.

  `{{ .Token }}` is the six-digit OTP, which GoTrue generates for every magic
  link whether a template shows it or not — the default one does not, which is
  why this file exists. `slice` splits it as xxx-xxx: three digits at a time is
  what a person can hold while looking away from the screen, and the hyphen is
  a grouping mark rather than part of the code.

  Written as table-based HTML with inline styles on purpose. Mail clients strip
  <style> blocks, ignore most modern CSS, and Outlook renders through Word —
  none of the app's tokens or utilities survive the trip, so the palette is
  hardcoded here and nowhere else in the codebase.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#0A0B0E;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:420px;background:#181B1F;border:1px solid #2F333A;border-radius:12px;">
        <tr>
          <td style="padding:28px 28px 0 28px;">
            <!-- The wordmark, in its brackets. An image would be blocked by
                 default in most clients; type always renders. -->
            <div style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:19px;font-weight:600;letter-spacing:0.12em;color:#F9FAFD;">
              <span style="color:#838A97;">|</span><span style="color:#52FC43;">S</span>tint<span style="color:#838A97;">|</span>
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:22px 28px 0 28px;">
            <div style="font-size:15px;line-height:1.5;color:#CACED7;">
              Enter this code to sign in:
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:14px 28px 0 28px;">
            <!-- The code itself. Large, monospaced and spaced out: this is the
                 one thing in the email that gets read character by character
                 and retyped, so it is set to be copied by eye. -->
            <div style="background:#202328;border:1px solid #2F333A;border-radius:8px;padding:18px 12px;text-align:center;">
              <span style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:32px;font-weight:600;letter-spacing:0.14em;color:#F9FAFD;">{{ slice .Token 0 3 }}<span style="color:#838A97;">-</span>{{ slice .Token 3 6 }}</span>
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:14px 28px 0 28px;">
            <div style="font-size:13px;line-height:1.5;color:#838A97;">
              It expires shortly and can only be used once. If you did not ask
              to sign in, you can ignore this email.
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:20px 28px 28px 28px;">
            <div style="border-top:1px solid #2F333A;padding-top:18px;font-size:13px;line-height:1.5;color:#838A97;">
              Signing in on the web instead?
              <a href="{{ .ConfirmationURL }}" style="color:#CACED7;text-decoration:underline;">Open Stint</a>.
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
