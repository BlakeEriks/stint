name: "Bug: misleading"
description: Shows something untrue or stale.
labels: [bug, "misleading"]
body:
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong?
      description: Where it happens and what it does. Name the screen, route or file if you know it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: >-
        Each it touches, applied as labels. web is the Next.js app, macos the
        menu bar app, android and ios the phone app, api /api/v1, the database
        and anything shared. None for tooling, docs or CI.
      multiple: true
      options:
        - web
        - macos
        - android
        - ios
        - api
