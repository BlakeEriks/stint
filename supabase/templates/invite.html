<!--
  The invite email. Layout and palette follow `magic_link.html`; its comments
  say why the HTML is tables and inline styles.

  The button carries a token hash to our own `/auth/confirm`, not
  `{{ .ConfirmationURL }}`. That URL sends the session back in a fragment the
  server never sees, and a `supabase.co` link in mail from `runstint.com`
  reads as spam to filters.

  `config.toml` points at this path for the LOCAL stack only; production
  holds a pasted copy in the dashboard.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#0A0B0E;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:420px;background:#181B1F;border:1px solid #2F333A;border-radius:12px;">
        <tr>
          <td style="padding:28px 28px 0 28px;">
            <div style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:19px;font-weight:600;letter-spacing:0.12em;color:#F9FAFD;">
              |Stint|
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:22px 28px 0 28px;">
            <div style="font-size:15px;line-height:1.5;color:#CACED7;">
              You're invited to Stint: time tracking and invoicing for
              solo contractors.
            </div>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 28px 0 28px;">
            <table cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td align="center" bgcolor="#52FC43" style="border-radius:8px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}"
                     style="display:block;padding:14px 24px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:600;letter-spacing:0.08em;color:#111316;text-decoration:none;">
                    ACCEPT INVITE
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:18px 28px 28px 28px;">
            <div style="font-size:13px;line-height:1.5;color:#8F96A4;">
              The button signs you in as {{ .Email }} and works once. If you
              weren't expecting this invite, you can ignore this email.
            </div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
