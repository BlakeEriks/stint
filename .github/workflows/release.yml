name: Release gate

# Vercel fires this when a production build is ready but NOT yet serving
# traffic. The build only becomes live once this workflow reports success,
# which is what keeps schema and code in order: the migration runs against
# production while the old code is still the one answering requests.
#
# Requires, in the Vercel project:
#   Settings -> Git -> Deployment Checks -> connect this repository
#   Settings -> Git -> "Required" for this check
# and a PRODUCTION_DB_URL secret here.
#
# If this fails, the deployment is never aliased and the previous one keeps
# serving. Vercel's "Force Promote" is the escape hatch.
on:
  repository_dispatch:
    types: [vercel.deployment.ready]

# A second push while this is running must not race the first one's
# migration.
concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read
  # The status action writes a commit status on the deployed SHA; Vercel
  # watches that status by name.
  statuses: write
  # It also LISTS THIS WORKFLOW'S JOBS to derive the conclusion for its
  # `post` hook. Without this the very first step dies with "Resource not
  # accessible by integration" and nothing downstream runs — no migration,
  # no status, and Vercel waits forever with no check to find.
  actions: read

jobs:
  migrate:
    # Preview builds fire the same event; only gate production. The field is
    # `environment` — an earlier `target` was wrong, and a mismatched
    # condition fails SILENTLY: the job is skipped, no status is ever set,
    # and the deployment just waits.
    if: github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    # PRODUCTION_DB_URL lives on this environment rather than the repository,
    # so it is reachable only from a job that names it — a workflow added
    # later cannot read production credentials by accident. It is also where
    # a required reviewer would go if this ever stops being a solo project,
    # and it gives the deployment its own audit log.
    environment: Production
    steps:
      # FIRST, before anything that can fail. This action's `post` hook sets
      # the final commit status, so it has to be registered up front: it
      # marks the check pending on entry and reports the job's real outcome
      # on exit. Vercel watches that commit status by name.
      #
      # The name must match the "Check Name" in Vercel -> Settings -> Git ->
      # Deployment Checks, and it carries the environment on purpose: Vercel
      # warns that a status shared across triggered runs gets overwritten, so
      # a preview dispatch must not be able to clobber the production result.
      # The `if:` above already blocks that, but a name collision is the kind
      # of thing that only bites once something else changes.
      - name: Report to Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: migrate-production

      - uses: actions/checkout@v7
        with:
          # Migrate the commit being deployed, not whatever main points at
          # now — a repository_dispatch always runs with the default
          # branch's HEAD as its SHA, and they differ the moment a second
          # merge lands.
          ref: ${{ github.event.client_payload.git.sha }}
      # Version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to production
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: pnpm migrate

      # The actual gate. RLS off on any table, or a table with no policy,
      # stops the release rather than exposing every user's rows.
      - name: Schema is sound
        env:
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
        run: pnpm verify:schema
