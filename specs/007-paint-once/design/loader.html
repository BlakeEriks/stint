<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* GENERATED from tokens.json — do not edit by hand. Run `pnpm tokens`. */
/* The palette for docs/design mockups. Token names are the RAW ones
   (--bg-primary, --text-muted, --border-subtle), not the Tailwind-stripped
   utilities the app uses — a mockup writes plain CSS, so there is no prefix
   collision to work around. */

:root {
    --bg-recessed: #0A0B0E;
    --bg-base: #111316;
    --bg-primary: #181B1F;
    --bg-elevated: #202328;
    --bg-hover: #272A30;
    --bg-active: #2F333A;
    --text-strong: #F9FAFD;
    --text-primary: #CACED7;
    --text-muted: #A0A7B4;
    --text-subtle: #8F96A4;
    --text-on-accent: #111316;
    --text-on-danger: #111316;
    --overlay: #05060899;
    --border-grid: #272A30;
    --border-subtle: #2F333A;
    --border-default: #393E48;
    --border-control: #666D79;
    --border-focus: #ABB1BD;
    --accent-default: #52FC43;
    --accent-hover: #8EFD83;
    --accent-active: #3FE231;
    --accent-subtle: #0E4B09;
    --accent-muted: #1B3518;
    --timer-running: #52FC43;
    --timer-idle: #666D79;
    --timer-warning: #5CABF2;
    --success: #36C52A;
    --warning: #5CABF2;
    --danger: #F64B66;
    --danger-muted: #471F23;
    --info: #6D7FAE;

    --shadow-card: 0 1px 2px rgba(0,0,0,0.40), 0 2px 10px rgba(0,0,0,0.34);
    --shadow-float: 0 2px 4px rgba(0,0,0,0.44), 0 8px 24px rgba(0,0,0,0.40);
    --shadow-halo-running: 0 0 0 3px color-mix(in oklab, var(--timer-running) 18%, transparent);

    --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --motion-instant: 90ms;
    --motion-quick: 160ms;
    --motion-count: 900ms;
    --motion-rise: 3px;
    --ease-standard: cubic-bezier(0.2, 0, 0.2, 1);
    --ease-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
    --ease-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);

    --mark-bound-width: 0.09em;
    --mark-bound-height: 1.05em;
    --mark-bound-gap: 0.18em;
    --mark-bound-radius: 999px;

    --proj-1: #DA8188;
    --proj-2: #D38B59;
    --proj-3: #B49D46;
    --proj-4: #42B59A;
    --proj-5: #35AFC9;
    --proj-6: #6EA1E2;
    --proj-7: #A390DC;
    --proj-8: #C984BA;

    --cat-1: #64A3E3;
    --cat-2: #F6964E;
}

[data-theme="light"] {
    --bg-recessed: #E8E2D8;
    --bg-base: #EEE9E0;
    --bg-primary: #F4F0E8;
    --bg-elevated: #FAF6EF;
    --bg-hover: #DED8CD;
    --bg-active: #D1CABE;
    --text-strong: #0B0A09;
    --text-primary: #2D2A25;
    --text-muted: #565149;
    --text-subtle: #635E56;
    --text-on-accent: #FFFFFF;
    --text-on-danger: #FFFFFF;
    --overlay: #1B1E2799;
    --border-grid: #DED8CD;
    --border-subtle: #D1CABE;
    --border-default: #C1BDB5;
    --border-control: #938E86;
    --border-focus: #4C4841;
    --accent-default: #315424;
    --accent-hover: #2A491E;
    --accent-active: #233F19;
    --accent-subtle: #4A783A;
    --accent-muted: #E0EFDB;
    --timer-running: #3A632C;
    --timer-idle: #938E86;
    --timer-warning: #1C6DAD;
    --success: #457036;
    --warning: #1C6DAD;
    --danger: #C21F43;
    --danger-muted: #FFEBEB;
    --info: #4A5A85;

    --shadow-card: 0 1px 2px rgba(16,18,26,0.06), 0 2px 8px rgba(16,18,26,0.07);
    --shadow-float: 0 2px 4px rgba(16,18,26,0.08), 0 8px 24px rgba(16,18,26,0.10);
    --shadow-halo-running: 0 0 0 3px color-mix(in oklab, var(--timer-running) 22%, transparent);
}

/* ── The type scale ────────────────────────────────────────────────
   One class per role, same as the app's @utility set. A mockup names a
   role (type-amount) and never assembles one, so a doc cannot invent a
   size the product does not have. */
.type-timer {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    @media (width >= 40rem) { font-size: 30px; }
    font-variant-numeric: tabular-nums;
}

.type-title {
    font-family: var(--font-sans);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.025em;
}

.type-hero {
    font-family: var(--font-sans);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.03em;
    @media (width >= 40rem) { font-size: 44px; }
}

.type-figure {
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.type-figure-hero {
    font-family: var(--font-mono);
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.type-lede {
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 400;
    @media (width >= 40rem) { font-size: 17px; }
}

.type-display {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    @media (width >= 40rem) { font-size: 28px; }
}

.type-section {
    font-family: var(--font-sans);
    font-size: 18px;
    font-weight: 500;
}

.type-heading {
    font-family: var(--font-sans);
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
}

.type-body {
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 400;
}

.type-control {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 400;
}

.type-support {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 400;
}

.type-amount {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
}

.type-amount-hero {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.type-duration {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
}

.type-meta {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
}

.type-meta-strong {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.type-wordmark {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.12em;
}

.type-wordmark-small {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
}

.type-nav {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.type-region-head {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
}

.type-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
}

.type-badge {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

/* ── The mark ──────────────────────────────────────────────────────
   `|Stint|` — one color, bounds included, inherited via currentColor.
   Set a font-size on .mark and everything scales from it. */
.mark {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.12em;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
}
.mark::before,
.mark::after {
    content: '';
    display: inline-block;
    flex: none;
    width: var(--mark-bound-width);
    height: var(--mark-bound-height);
    margin: 0 var(--mark-bound-gap);
    border-radius: var(--mark-bound-radius);
    background: currentColor;
}

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg-base); color: var(--text-primary);
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1120px; margin: 0 auto; padding: 40px 16px 80px; }
  .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  .top h1 { margin: 0 0 6px; color: var(--text-strong); }
  .top p { margin: 0; color: var(--text-muted); max-width: 60ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; }
  .seg button, .play {
    border: 0; background: transparent; color: var(--text-muted);
    padding: 7px 12px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--bg-active); color: var(--text-strong); }
  .play {
    border-radius: 8px; background: var(--accent-default); color: var(--text-on-accent);
    font-weight: 500; min-width: 116px;
  }
  .play:disabled { background: var(--bg-active); color: var(--text-muted); cursor: default; }

  /* ── In context ── */
  .context { margin-top: 44px; }
  .context h2 { margin: 0 0 4px; color: var(--text-strong); }
  .context .sub { margin: 0 0 18px; color: var(--text-muted); }
  .frames { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .app {
    flex: 1 1 560px; max-width: 760px; height: 460px; min-width: 0;
    background: var(--bg-base); border: 1px solid var(--border-default); border-radius: 12px;
    display: grid; grid-template-columns: 140px 1fr; grid-template-rows: auto 1fr auto; overflow: hidden;
  }
  .app.phone { flex: 0 0 390px; max-width: 390px; grid-template-columns: 1fr; }
  .app.phone .rail { display: none; }
  .app header { grid-column: 1 / -1; padding: 14px 18px; color: var(--text-strong); display: flex; align-items: center; }
  .app .rail { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
  .app .rail span { padding: 7px 10px; border-radius: 6px; color: var(--text-subtle); }
  .app .rail span.on { background: var(--bg-hover); color: var(--text-strong); }
  .app .panel {
    margin: 0 14px 0 0; min-width: 0; background: var(--bg-primary); border: 1px solid var(--border-subtle);
    border-radius: 12px; box-shadow: var(--shadow-card); position: relative; overflow: hidden;
  }
  .app.phone .panel { margin: 0 10px; }
  .dock {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 12px 18px; color: var(--text-subtle);
  }
  .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--timer-idle); flex: none; }
  .dock .t { margin-left: auto; color: var(--timer-idle); }

  .pop {
    flex: 0 0 320px; width: 320px; background: var(--bg-base); border: 1px solid var(--border-subtle);
    border-radius: 12px; box-shadow: var(--shadow-float); overflow: hidden;
  }
  .pop .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; color: var(--text-strong); }
  .pop .head .t { color: var(--timer-idle); }
  .pop .panel { position: relative; height: 230px; border-top: 1px solid var(--border-subtle); }
  .slot { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 24px; }
  .slot > .ld { width: 100%; }
  .slot.content { place-items: start stretch; padding: 20px 22px; }
  .pop .slot.content { padding: 14px; }

  /* Placeholder content */
  .content-in { animation: rise var(--motion-quick) var(--ease-decelerate) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(var(--motion-rise)); } }
  .c-label { color: var(--text-subtle); margin: 0 0 6px; }
  .c-fig { color: var(--text-strong); margin: 0 0 16px; }
  .rows { display: flex; flex-direction: column; }
  .rows div { display: flex; align-items: center; gap: 10px; height: 38px; border-bottom: 1px solid var(--border-grid); }
  .rows .chip { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .rows .n { color: var(--text-primary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rows .d { color: var(--text-muted); }
  /* ── The loader ──
     One word where the content will be. Blank until 800ms, so a quick load
     never shows it; then it fades in, and once in it breathes, so a long wait
     still reads as alive. It leaves in one quick fade and the content comes
     in once. */
  .ld-still { display: flex; justify-content: center; color: var(--text-subtle);
    animation: ld-in var(--motion-count) var(--ease-standard) 600ms both, still-pulse 2.4s ease-in-out 1500ms infinite; }
  @keyframes ld-in { from { opacity: 0; } }
  @keyframes still-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) {
    .ld-still { animation: ld-in var(--motion-count) linear 600ms both; }
    .content-in { animation-name: ld-in; }
  }
</style>
</head>
<body>
<main class="page">
  <div class="top">
    <div>
      <h1 class="type-title">Loader</h1>
      <p class="type-body">One word, "Loading", centered where the content will be. The frame never moves.</p>
    </div>
    <div class="controls">
      <div class="seg" id="state">
        <button class="type-control" data-v="wait">Under 800ms</button>
        <button class="type-control" data-v="loading" aria-pressed="true">Loading</button>
        <button class="type-control" data-v="loaded">Loaded</button>
      </div>
      <div class="seg" id="theme">
        <button class="type-control" data-v="dark" aria-pressed="true">Dark</button>
        <button class="type-control" data-v="light" aria-pressed="false">Light</button>
      </div>
      <div class="seg" id="width">
        <button class="type-control" data-v="desktop" aria-pressed="true">Desktop</button>
        <button class="type-control" data-v="phone" aria-pressed="false">Phone</button>
      </div>
    </div>
  </div>
  <div class="controls" style="margin-bottom:18px;align-items:center;">
    <div class="seg" id="len"><button class="type-meta" data-v="600">0.6s</button><button class="type-meta" data-v="1500">1.5s</button><button class="type-meta" data-v="3000" aria-pressed="true">3s</button><button class="type-meta" data-v="6000">6s</button></div>
    <button class="play type-control" id="play">Play a load</button>
  </div>
  <div class="frames">
    <div class="app" id="app">
      <header><span class="mark" style="font-size:16px">Stint</span></header>
      <nav class="rail">
        <span class="type-nav on">Home</span><span class="type-nav">Calendar</span><span class="type-nav">Clients</span><span class="type-nav">Invoices</span><span class="type-nav">Settings</span>
      </nav>
      <div class="panel" id="appPanel"></div>
      <div class="dock"><span class="pip"></span><span class="type-support">No timer running</span><span class="t type-duration">0:00:00</span></div>
    </div>
    <div>
      <div class="pop">
        <div class="head"><span class="mark" style="font-size:14px">Stint</span><span class="t type-duration">0:00:00</span></div>
        <div class="panel" id="popPanel"></div>
      </div>
      <p class="phase type-meta" id="phase"></p>
    </div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const root = document.documentElement;
const ms = name => parseFloat(getComputedStyle(root).getPropertyValue(name));
const wait = t => new Promise(r => setTimeout(r, t));
let loadMs = 3000, run = 0;

const ROWS = [['Northwind Trading', 'Warehouse dashboard', '3:15', 6], ['Meridian Labs', 'Data pipeline audit', '2:40', 7], ['Byrne Studio', 'Brand site rebuild', '1:20', 3], ['Northwind Trading', 'Rush: peak season fixes', '0:30', 6]];
const content = small => `<div class="content-in">
  <p class="c-label type-label">This week</p>
  ${small ? '' : '<p class="c-fig type-figure">31.5 h <span class="type-amount" style="color:var(--text-muted)">$4,725.00</span></p>'}
  <div class="rows">${ROWS.slice(0, small ? 3 : 4).map(([cl, t, d, p]) =>
    `<div><span class="chip" style="background:var(--proj-${p})"></span><span class="n type-control">${cl} · ${t}</span><span class="d type-duration">${d}</span></div>`).join('')}</div></div>`;
const loader = () => '<div class="ld-still type-label" role="status">Loading</div>';

function show(panel, state, small) {
  panel.innerHTML = state === 'wait' ? '' : `<div class="slot${state === 'loaded' ? ' content' : ''}">${state === 'loaded' ? content(small) : loader()}</div>`;
}
function showAll(state) { show($('#appPanel'), state, false); show($('#popPanel'), state, true); }

async function load(panel, small, id) {
  panel.replaceChildren();
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.innerHTML = loader();
  panel.append(slot);
  await wait(loadMs);
  if (id !== run) return;
  await slot.animate([{ opacity: getComputedStyle(slot.firstChild).opacity }, { opacity: 0 }], { duration: ms('--motion-quick'), easing: 'ease-out', fill: 'forwards' }).finished;
  if (id !== run) return;
  panel.innerHTML = `<div class="slot content">${content(small)}</div>`;
}
$('#play').onclick = async () => {
  const id = ++run;
  $('#phase').textContent = `Data arrives at ${loadMs / 1000}s`;
  await Promise.all([load($('#appPanel'), false, id), load($('#popPanel'), true, id)]);
  if (id === run) $('#phase').textContent = 'Loaded';
};

function seg(id, on) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    on(b.dataset.v);
  });
}
seg('#state', v => { run++; $('#phase').textContent = ''; showAll(v); });
seg('#theme', v => root.dataset.theme = v);
seg('#width', v => $('#app').classList.toggle('phone', v === 'phone'));
seg('#len', v => loadMs = +v);
showAll('loading');
</script>
</body>
</html>
