name: "Bug: looks wrong"
description: A visual or feel fault, with nothing wrong underneath.
labels: [bug, "looks wrong"]
body:
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong?
      description: Where it happens and what it does. Name the screen, route or file if you know it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
