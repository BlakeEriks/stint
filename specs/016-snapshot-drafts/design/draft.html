<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshot drafts · the draft</title>
<style>
/* GENERATED from tokens.json — do not edit by hand. Run `pnpm tokens`. */
/* The palette for docs/design mockups. Token names are the RAW ones
   (--bg-primary, --text-muted, --border-subtle), not the Tailwind-stripped
   utilities the app uses — a mockup writes plain CSS, so there is no prefix
   collision to work around. */

:root {
    --bg-recessed: #0A0B0E;
    --bg-base: #111316;
    --bg-primary: #181B1F;
    --bg-elevated: #202328;
    --bg-hover: #272A30;
    --bg-active: #2F333A;
    --text-strong: #F9FAFD;
    --text-primary: #CACED7;
    --text-muted: #A0A7B4;
    --text-subtle: #8F96A4;
    --text-on-accent: #111316;
    --text-on-danger: #111316;
    --overlay: #05060899;
    --border-grid: #272A30;
    --border-subtle: #2F333A;
    --border-default: #393E48;
    --border-control: #666D79;
    --border-focus: #ABB1BD;
    --accent-default: #52FC43;
    --accent-hover: #8EFD83;
    --accent-active: #3FE231;
    --accent-subtle: #0E4B09;
    --accent-muted: #1B3518;
    --timer-running: #52FC43;
    --timer-idle: #666D79;
    --timer-warning: #5CABF2;
    --success: #36C52A;
    --warning: #5CABF2;
    --warning-muted: #162B40;
    --danger: #F64B66;
    --danger-muted: #471F23;
    --info: #6D7FAE;

    --shadow-card: 0 1px 2px rgba(0,0,0,0.40), 0 2px 10px rgba(0,0,0,0.34);
    --shadow-float: 0 2px 4px rgba(0,0,0,0.44), 0 8px 24px rgba(0,0,0,0.40);
    --shadow-halo-running: 0 0 0 3px color-mix(in oklab, var(--timer-running) 18%, transparent);

    --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --motion-instant: 90ms;
    --motion-quick: 160ms;
    --motion-count: 900ms;
    --motion-rise: 3px;
    --ease-standard: cubic-bezier(0.2, 0, 0.2, 1);
    --ease-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
    --ease-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);

    --mark-bound-width: 0.09em;
    --mark-bound-height: 1.05em;
    --mark-bound-gap: 0.18em;
    --mark-bound-radius: 999px;

    --proj-1: #DA8188;
    --proj-2: #D38B59;
    --proj-3: #B49D46;
    --proj-4: #42B59A;
    --proj-5: #35AFC9;
    --proj-6: #6EA1E2;
    --proj-7: #A390DC;
    --proj-8: #C984BA;

    --cat-1: #64A3E3;
    --cat-2: #F6964E;

    --print-ground: #FFFFFF;
    --print-ink: #1A1C21;
    --print-muted: #626875;
    --print-faint: #707784;
    --print-rule: #D1D5DD;
    --print-hairline: #E4E6EC;
    --print-band: #F2F3F6;
    --print-void: #E9504D;
    --print-accent: #315424;
}

[data-theme="light"] {
    --bg-recessed: #E8E2D8;
    --bg-base: #EEE9E0;
    --bg-primary: #F4F0E8;
    --bg-elevated: #FAF6EF;
    --bg-hover: #DED8CD;
    --bg-active: #D1CABE;
    --text-strong: #0B0A09;
    --text-primary: #2D2A25;
    --text-muted: #565149;
    --text-subtle: #635E56;
    --text-on-accent: #FFFFFF;
    --text-on-danger: #FFFFFF;
    --overlay: #1B1E2799;
    --border-grid: #DED8CD;
    --border-subtle: #D1CABE;
    --border-default: #C1BDB5;
    --border-control: #938E86;
    --border-focus: #4C4841;
    --accent-default: #315424;
    --accent-hover: #2A491E;
    --accent-active: #233F19;
    --accent-subtle: #4A783A;
    --accent-muted: #E0EFDB;
    --timer-running: #3A632C;
    --timer-idle: #938E86;
    --timer-warning: #1C6DAD;
    --success: #457036;
    --warning: #1C6DAD;
    --warning-muted: #E3EEF8;
    --danger: #C21F43;
    --danger-muted: #FFEBEB;
    --info: #4A5A85;

    --shadow-card: 0 1px 2px rgba(16,18,26,0.06), 0 2px 8px rgba(16,18,26,0.07);
    --shadow-float: 0 2px 4px rgba(16,18,26,0.08), 0 8px 24px rgba(16,18,26,0.10);
    --shadow-halo-running: 0 0 0 3px color-mix(in oklab, var(--timer-running) 22%, transparent);
}

/* ── The type scale ────────────────────────────────────────────────
   One class per role, same as the app's @utility set. A mockup names a
   role (type-amount) and never assembles one, so a doc cannot invent a
   size the product does not have. */
.type-timer {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    @media (width >= 40rem) { font-size: 30px; }
    font-variant-numeric: tabular-nums;
}

.type-title {
    font-family: var(--font-sans);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.025em;
}

.type-hero {
    font-family: var(--font-sans);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.03em;
    @media (width >= 40rem) { font-size: 44px; }
}

.type-figure {
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.type-figure-hero {
    font-family: var(--font-mono);
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.type-lede {
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 400;
    @media (width >= 40rem) { font-size: 17px; }
}

.type-display {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    @media (width >= 40rem) { font-size: 28px; }
}

.type-section {
    font-family: var(--font-sans);
    font-size: 18px;
    font-weight: 500;
}

.type-heading {
    font-family: var(--font-sans);
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
}

.type-body {
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 400;
}

.type-control {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 400;
}

.type-support {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 400;
}

.type-amount {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
}

.type-amount-hero {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.type-duration {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
}

.type-meta {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
}

.type-meta-strong {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.type-wordmark {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.12em;
}

.type-wordmark-small {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
}

.type-nav {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.type-region-head {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
}

.type-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
}

.type-badge {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

/* ── The mark ──────────────────────────────────────────────────────
   `|Stint|` — one color, bounds included, inherited via currentColor.
   Set a font-size on .mark and everything scales from it. */
.mark {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.12em;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
}
.mark::before,
.mark::after {
    content: '';
    display: inline-block;
    flex: none;
    width: var(--mark-bound-width);
    height: var(--mark-bound-height);
    margin: 0 var(--mark-bound-gap);
    border-radius: var(--mark-bound-radius);
    background: currentColor;
}
</style>
<style>
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg-recessed); color: var(--text-primary); padding: 16px; font-family: var(--font-sans); }
button { font: inherit; color: inherit; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--border-default); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 6px 10px; color: var(--text-muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg-active); color: var(--text-strong); }
.caption { color: var(--text-muted); margin-bottom: 14px; max-width: 900px; min-height: 20px; }
.caption b { color: var(--text-strong); font-weight: 500; }
.app { max-width: 1180px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 16px; box-shadow: var(--shadow-float); overflow: hidden; }
.phone .app { max-width: 390px; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; }
.top .mark { color: var(--text-strong); font-size: 14px; }
.top .who { color: var(--text-subtle); }
.row { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px; padding: 0 16px 16px; }
.phone .row { grid-template-columns: 1fr; padding: 0 8px 8px; }
.rail { display: flex; flex-direction: column; gap: 4px; padding-top: 8px; }
.phone .rail { display: none; }
.rail span { padding: 8px 12px; border-radius: 6px; color: var(--text-muted); }
.rail span.on { background: var(--bg-elevated); color: var(--text-strong); }
.panel { background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: 12px; box-shadow: var(--shadow-card); padding: 20px; min-height: 600px; }
.phone .panel { padding: 14px; }
.back { color: var(--text-subtle); margin-bottom: 14px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; }
.title { display: flex; align-items: center; gap: 10px; color: var(--text-strong); }
.badge { border: 1px solid var(--border-default); border-radius: 4px; padding: 2px 6px; color: var(--text-muted); }
.saved { color: var(--text-subtle); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--border-default); background: var(--bg-elevated); color: var(--text-strong); display: inline-flex; align-items: center; gap: 6px; cursor: default; white-space: nowrap; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
.btn.danger { background: transparent; border-color: transparent; color: var(--danger); }
.btn.accent { background: var(--accent-default); border-color: var(--accent-default); color: var(--text-on-accent); }
.btn[disabled] { opacity: .45; }
.hint { color: var(--text-subtle); margin-top: 10px; }
.notice { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border: 1px solid var(--border-default); border-left: 3px solid var(--warning); border-radius: 8px; padding: 12px 14px; background: var(--bg-elevated); }
.notice .what { display: flex; flex-direction: column; gap: 2px; }
.notice b { color: var(--text-strong); font-weight: 500; }
.notice span { color: var(--text-muted); }
.work { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 24px; margin-top: 18px; align-items: start; }
.phone .work { grid-template-columns: 1fr; }
.form { display: flex; flex-direction: column; gap: 14px; }
.f { display: flex; flex-direction: column; gap: 6px; }
.f > span { color: var(--text-subtle); }
.in { height: 36px; border: 1px solid var(--border-control); border-radius: 6px; padding: 0 12px; display: flex; align-items: center; color: var(--text-strong); background: var(--bg-primary); }
.in.empty { color: var(--text-subtle); }
.two { display: flex; gap: 12px; }
.two > * { flex: 1 1 0; min-width: 0; }
.paper { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 18px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 24px; color: var(--text-muted); margin-bottom: 12px; }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border-grid); }
.line .n { display: flex; flex-direction: column; min-width: 0; }
.line small { color: var(--text-subtle); }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; color: var(--text-strong); }
.panel { position: relative; }
.scrim { position: absolute; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog { background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: 12px; box-shadow: var(--shadow-float); padding: 20px; max-width: 400px; width: 100%; display: flex; flex-direction: column; gap: 10px; color: var(--text-strong); }
.dialog p { color: var(--text-muted); }
.empty-lines { color: var(--text-subtle); padding: 18px 0; }
</style>
</head>
<body>
<div class="bar type-control">
  <div class="seg" id="state"></div>
  <div class="seg" id="size"><button data-v="desktop" aria-pressed="true">Desktop</button><button data-v="phone">Phone</button></div>
  <div class="seg" id="theme"><button data-v="dark" aria-pressed="true">Dark</button><button data-v="light">Light</button></div>
</div>
<p class="caption type-support" id="caption"></p>
<div class="app">
  <div class="top"><span class="mark">Stint</span><span class="who type-support">builder@localhost.test</span></div>
  <div class="row">
    <nav class="rail type-nav"><span>Home</span><span>Calendar</span><span>Clients</span><span class="on">Invoices</span></nav>
    <section class="panel" id="panel"></section>
  </div>
</div>
<script>
const s = { state: 'saved', size: 'desktop', theme: 'dark' };
const STATES = [
  ['new', 'New invoice, no client'],
  ['saved', 'Saved, up to date'],
  ['work', 'New work in period'],
  ['asking', 'Mark sent asking'],
  ['nothing', 'Nothing to bill'],
];
const line = (n, d, h, a) => `<div class="line"><div class="n"><span class="type-body">${n}</span><small class="type-support">${d}</small></div><span class="type-amount">${h}&nbsp;&nbsp;${a}</span></div>`;
const field = (label, value, empty) => `<label class="f"><span class="type-label">${label}</span><div class="in type-control${empty ? ' empty' : ''}">${value}</div></label>`;

function form(client) {
  return `<div class="form">
    ${field('Client', client ? 'Northwind Trading' : 'Choose a client', !client)}
    ${client ? `<div class="two">${field('From', '10/01/2026')}${field('To', '10/15/2026')}</div>
    ${field('Due', '11/14/2026 · Net 30')}
    ${field('Reference', 'PO number, contract or SOW', true)}
    ${field('Lines', 'One per project')}
    ${field('Payment details', 'Business checking')}
    ${field('Notes', 'Thank you for your business.')}` : ''}
  </div>`;
}

function paper() {
  if (s.state === 'nothing')
    return `<div class="paper"><div class="meta type-support"><span>Northwind Trading</span><span>Oct 1 – Oct 15, 2026</span></div><p class="empty-lines type-support">Nothing to bill in Oct 1 – 15 yet. Change the dates, or add a charge.</p><div class="total type-heading"><span>Total</span><span class="type-amount-hero">$0.00</span></div></div>`;
  return `<div class="paper"><div class="meta type-support"><span>Northwind Trading</span><span>Oct 1 – Oct 15, 2026</span><span>Due Nov 14, 2026</span></div>
    ${line('Warehouse dashboard', '12 entries · $150.00/h', '22.50h', '$3,375.00')}
    ${line('Rush: peak season fixes', '2 entries · $195.00/h', '4.00h', '$780.00')}
    <div class="total type-heading"><span>Total</span><span class="type-amount-hero">$4,155.00</span></div></div>`;
}

function actions() {
  if (s.state === 'new') return '';
  const off = s.state === 'nothing' ? 'disabled' : '';
  return `<div class="actions type-control"><button class="btn danger">Discard draft</button><button class="btn" ${off}>Mark sent</button><button class="btn accent" ${off}>Download PDF</button></div>`;
}

function hint() {
  if (s.state === 'new') return 'Pick a client and Stint starts the draft. It saves as you go.';
  return 'It holds the work it shows. Download it, send it from your own address, then mark it sent.';
}

function render() {
  document.documentElement.dataset.theme = s.theme;
  document.body.classList.toggle('phone', s.size === 'phone');
  document.getElementById('caption').innerHTML = 'New work in the draft\'s period is offered above the invoice; nothing joins it until you add it.';
  for (const [id, list] of [['state', STATES]])
    document.getElementById(id).innerHTML = list.map(([v, l]) => `<button data-v="${v}" aria-pressed="${v === s[id]}">${l}</button>`).join('');
  const isNew = s.state === 'new';
  const title = isNew
    ? `<span class="type-title" style="color:var(--text-strong)">New invoice</span>`
    : `<div class="title"><span class="type-title">STINT-0042</span><span class="badge type-badge">Draft</span><span class="saved type-support">Saved</span></div>`;
  const notice = s.state === 'work'
    ? `<div class="notice"><div class="what"><b class="type-body">2 new entries, 2.50h, in this period</b><span class="type-support">Logged since you built it · $375.00. They stay off unless you add them.</span></div><button class="btn type-control">Add to draft</button></div>`
    : '';
  document.getElementById('panel').innerHTML = `<div class="back type-support">← Invoices</div>
    <div class="head">${title}${actions()}</div>
    <p class="hint type-support">${hint()}</p>${notice}
    <div class="work">${form(!isNew)}${isNew ? '' : paper()}</div>${s.state === 'asking' ? dialog() : ''}`;
}

function dialog() {
  return `<div class="scrim"><div class="dialog" role="dialog"><b class="type-heading">Mark STINT-0042 sent</b>
    <p class="type-support">Lock 14 entries · $4,155.00. The invoice stays as it is.</p>
    <div class="actions type-control" style="justify-content:flex-end"><button class="btn ghost">Keep as draft</button><button class="btn accent">Lock</button></div></div></div>`;
}
for (const id of ['state', 'size', 'theme'])
  document.getElementById(id).addEventListener('click', (e) => {
    const v = e.target.dataset.v; if (!v) return;
    s[id] = v;
    for (const b of document.getElementById(id).children) b.setAttribute('aria-pressed', b.dataset.v === v);
    render();
  });
render();
</script>
</body>
</html>
