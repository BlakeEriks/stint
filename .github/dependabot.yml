version: 2
updates:
  # One grouped PR a week. Ungrouped, a monorepo with Next, React, Tailwind,
  # Radix and Supabase opens a dozen a week and they stop getting read — the
  # failure mode is a stale repo full of ignored PRs, not an unpatched one.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Chicago }
    open-pull-requests-limit: 3
    versioning-strategy: increase
    # `update-types` on a GROUP only decides what gets grouped — a major
    # falls outside every group and still opens its own PR. So majors are
    # ignored outright and bumped deliberately instead: TypeScript 5 -> 7 and
    # @types/node 22 -> 26 both arrived unasked on the first run, and a
    # toolchain major is a decision, not a chore.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      # Framework minors still change behaviour; keep them separate so a
      # Next or React bump is reviewable on its own.
      framework:
        patterns: ["next", "react", "react-dom", "@types/react*"]
        update-types: [minor, patch]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["next", "react", "react-dom", "@types/react*"]
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message: { prefix: "deps", include: scope }

  # Actions get pinned by major tag, so this mostly catches deprecations —
  # the Node 20 runtime warning was exactly this class of thing.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: America/Chicago }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
    commit-message: { prefix: "ci" }
