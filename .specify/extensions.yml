installed:
- assess
settings:
  auto_execute_hooks: true
hooks:
  # Stint's own step, not an extension's: a feature that adds or changes UI
  # is offered a design review before planning (docs/sdlc.md). The skill
  # returns at once when the spec already records a pick or a skip.
  before_plan:
  - extension: stint
    command: design-review
    enabled: true
    optional: false
    description: Record a design pick, or a skip, before planning
  # Stint's own step: the review /work-issues gives every round, so a
  # feature's code meets the same standards before its PR opens.
  after_implement:
  - extension: stint
    command: standards-review
    enabled: true
    optional: false
    description: Review the feature's commits against the standards
