name: ready-for-qa

# Posts to Discord #events when a PR is labelled `ready-for-qa`: CI green, no
# feedback outstanding, its preview ready to try. `/work-issues` sets the
# label; anyone adding it by hand posts the same way.
#
# Requires DISCORD_EVENTS_WEBHOOK, a webhook on #events, as a repository
# secret.
on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  tell-discord:
    if: github.event.label.name == 'ready-for-qa'
    runs-on: ubuntu-latest
    steps:
      - env:
          WEBHOOK: ${{ secrets.DISCORD_EVENTS_WEBHOOK }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          text="🧪 Ready for QA: #$PR $TITLE — $URL"
          # Empty allowed_mentions: a PR title can never ping anyone.
          jq -n --arg c "$text" '{content: $c, allowed_mentions: {parse: []}}' |
            curl -fsS -m 10 -o /dev/null -H 'Content-Type: application/json' -d @- "$WEBHOOK"
