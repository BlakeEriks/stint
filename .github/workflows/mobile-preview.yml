name: mobile-preview

# A PR's phone build: an Android APK pointed at the PR's Vercel preview and
# signed in on launch as pr-<n>@preview.test, built on EAS and linked on the
# PR for its Try it (`docs/mobile.md`, Preview builds). It installs as Stint
# Preview, beside the released app.
#
# Only when the app or a package it imports changes: EAS's free tier counts
# builds by the month.
#
# The link is public, so the build holds no secret: the reviewer types
# Vercel's bypass into the app once (`apps/mobile/src/bypass.ts`).
#
# Requires, once: the EXPO_TOKEN secret, and the EAS_PROJECT_ID and
# EXPO_OWNER variables.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/mobile/**'
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/schema/**'
      - 'packages/design-tokens/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pull-requests: write

# A newer push supersedes a build still queued for the last one.
concurrency:
  group: mobile-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    # Dependabot's PRs cannot read secrets.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.1.0
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # Pinned: this step holds the Expo token.
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 25.3.0
          token: ${{ secrets.EXPO_TOKEN }}

      # EAS hands a cloud build its profile's `env` and nothing from this
      # shell, so the PR's values go into eas.json here, never into git.
      - name: Point the preview profile at this PR
        working-directory: apps/mobile
        run: |
          # A long branch has no preview for the build to talk to.
          url=$(node ../../scripts/preview-url.mjs "$BRANCH")
          jq --arg pr "$PR" --arg url "$url" \
             --arg project "$EAS_PROJECT_ID" --arg owner "$EXPO_OWNER" \
            '.build.preview.env += {
               STINT_PREVIEW_PR: $pr, STINT_APP_URL: $url,
               EAS_PROJECT_ID: $project, EXPO_OWNER: $owner
             }' eas.json > eas.pr.json
          mv eas.pr.json eas.json

      - name: Build
        id: build
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > build.json
          id=$(jq -r '.[0].id' build.json)
          echo "url=https://expo.dev/accounts/${EXPO_OWNER}/projects/stint/builds/${id}" >> "$GITHUB_OUTPUT"

      - name: Link it on the PR
        env:
          URL: ${{ steps.build.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        # By its marker, and only the bot's: `--edit-last` would take whichever
        # comment the bot wrote last, such as doc drift's, and anyone can type
        # the marker.
        run: |
          body="<!-- mobile-preview -->
          **Phone build** for ${SHA:0:7}: open ${URL} on your Android phone and tap Install. On its first launch, paste Vercel's bypass; it opens as Stint Preview, signed in as pr-${PR}@preview.test."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- mobile-preview -->"))) | .id' \
            | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
