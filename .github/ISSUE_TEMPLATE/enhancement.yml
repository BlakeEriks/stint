name: Enhancement
description: A tweak or improvement to something that exists. A new capability is a Feature.
labels: [enhancement]
body:
  - type: textarea
    id: today
    attributes:
      label: What exists today?
      description: The screen, route or behavior, and what is wrong with it as it stands.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change?
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: >-
        Each it touches, applied as labels. web is the Next.js app, macos the
        menu bar app, android and ios the phone app, api /api/v1, the database
        and anything shared. None for tooling, docs or CI.
      multiple: true
      options:
        - web
        - macos
        - android
        - ios
        - api
