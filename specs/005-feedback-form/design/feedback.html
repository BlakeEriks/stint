<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* GENERATED from tokens.json — do not edit by hand. Run `pnpm tokens`. */
/* The palette for docs/design mockups. Token names are the RAW ones
   (--bg-primary, --text-muted, --border-subtle), not the Tailwind-stripped
   utilities the app uses — a mockup writes plain CSS, so there is no prefix
   collision to work around. */

:root {
    --bg-recessed: #0A0B0E;
    --bg-base: #111316;
    --bg-primary: #181B1F;
    --bg-elevated: #202328;
    --bg-hover: #272A30;
    --bg-active: #2F333A;
    --text-strong: #F9FAFD;
    --text-primary: #CACED7;
    --text-muted: #A0A7B4;
    --text-subtle: #8F96A4;
    --text-on-accent: #111316;
    --text-on-danger: #111316;
    --overlay: #05060899;
    --border-grid: #272A30;
    --border-subtle: #2F333A;
    --border-default: #393E48;
    --border-control: #666D79;
    --border-focus: #ABB1BD;
    --accent-default: #52FC43;
    --accent-hover: #8EFD83;
    --accent-active: #3FE231;
    --accent-subtle: #0E4B09;
    --accent-muted: #1B3518;
    --timer-running: #52FC43;
    --timer-idle: #666D79;
    --timer-warning: #5CABF2;
    --success: #36C52A;
    --warning: #5CABF2;
    --danger: #F64B66;
    --danger-muted: #471F23;
    --info: #6D7FAE;

    --shadow-card: 0 1px 2px rgba(0,0,0,0.40), 0 2px 10px rgba(0,0,0,0.34);
    --shadow-float: 0 2px 4px rgba(0,0,0,0.44), 0 8px 24px rgba(0,0,0,0.40);
    --shadow-halo-running: 0 0 0 3px color-mix(in oklab, var(--timer-running) 18%, transparent);

    --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --motion-instant: 90ms;
    --motion-quick: 160ms;
    --motion-count: 900ms;
    --motion-rise: 3px;
    --ease-standard: cubic-bezier(0.2, 0, 0.2, 1);
    --ease-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
    --ease-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);

    --mark-bound-width: 0.09em;
    --mark-bound-height: 1.05em;
    --mark-bound-gap: 0.18em;
    --mark-bound-radius: 999px;

    --proj-1: #DA8188;
    --proj-2: #D38B59;
    --proj-3: #B49D46;
    --proj-4: #42B59A;
    --proj-5: #35AFC9;
    --proj-6: #6EA1E2;
    --proj-7: #A390DC;
    --proj-8: #C984BA;

    --cat-1: #64A3E3;
    --cat-2: #F6964E;
}

[data-theme="light"] {
    --bg-recessed: #E8E2D8;
    --bg-base: #EEE9E0;
    --bg-primary: #F4F0E8;
    --bg-elevated: #FAF6EF;
    --bg-hover: #DED8CD;
    --bg-active: #D1CABE;
    --text-strong: #0B0A09;
    --text-primary: #2D2A25;
    --text-muted: #565149;
    --text-subtle: #635E56;
    --text-on-accent: #FFFFFF;
    --text-on-danger: #FFFFFF;
    --overlay: #1B1E2799;
    --border-grid: #DED8CD;
    --border-subtle: #D1CABE;
    --border-default: #C1BDB5;
    --border-control: #938E86;
    --border-focus: #4C4841;
    --accent-default: #315424;
    --accent-hover: #2A491E;
    --accent-active: #233F19;
    --accent-subtle: #4A783A;
    --accent-muted: #E0EFDB;
    --timer-running: #3A632C;
    --timer-idle: #938E86;
    --timer-warning: #1C6DAD;
    --success: #457036;
    --warning: #1C6DAD;
    --danger: #C21F43;
    --danger-muted: #FFEBEB;
    --info: #4A5A85;

    --shadow-card: 0 1px 2px rgba(16,18,26,0.06), 0 2px 8px rgba(16,18,26,0.07);
    --shadow-float: 0 2px 4px rgba(16,18,26,0.08), 0 8px 24px rgba(16,18,26,0.10);
    --shadow-halo-running: 0 0 0 3px color-mix(in oklab, var(--timer-running) 22%, transparent);
}

/* ── The type scale ────────────────────────────────────────────────
   One class per role, same as the app's @utility set. A mockup names a
   role (type-amount) and never assembles one, so a doc cannot invent a
   size the product does not have. */
.type-timer {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    @media (width >= 40rem) { font-size: 30px; }
    font-variant-numeric: tabular-nums;
}

.type-title {
    font-family: var(--font-sans);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.025em;
}

.type-hero {
    font-family: var(--font-sans);
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.03em;
    @media (width >= 40rem) { font-size: 44px; }
}

.type-figure {
    font-family: var(--font-mono);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.type-figure-hero {
    font-family: var(--font-mono);
    font-size: 40px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.type-lede {
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 400;
    @media (width >= 40rem) { font-size: 17px; }
}

.type-display {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    @media (width >= 40rem) { font-size: 28px; }
}

.type-section {
    font-family: var(--font-sans);
    font-size: 18px;
    font-weight: 500;
}

.type-heading {
    font-family: var(--font-sans);
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
}

.type-body {
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 400;
}

.type-control {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 400;
}

.type-support {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 400;
}

.type-amount {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
}

.type-amount-hero {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}

.type-duration {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
}

.type-meta {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
}

.type-meta-strong {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.type-wordmark {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.12em;
}

.type-wordmark-small {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
}

.type-nav {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.type-region-head {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
}

.type-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
}

.type-badge {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

/* ── The mark ──────────────────────────────────────────────────────
   `|Stint|` — one color, bounds included, inherited via currentColor.
   Set a font-size on .mark and everything scales from it. */
.mark {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.12em;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
}
.mark::before,
.mark::after {
    content: '';
    display: inline-block;
    flex: none;
    width: var(--mark-bound-width);
    height: var(--mark-bound-height);
    margin: 0 var(--mark-bound-gap);
    border-radius: var(--mark-bound-radius);
    background: currentColor;
}

/* ── Review page ─────────────────────────────────────────────── */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-recessed); color: var(--text-primary); font-family: var(--font-sans); }
button { font: inherit; color: inherit; cursor: pointer; }
.bar { overflow-x: auto; position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 12px 16px; background: var(--bg-base); border-bottom: 1px solid var(--border-subtle); }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--bg-recessed); }
.seg button { border: 0; background: none; white-space: nowrap; padding: 6px 10px; border-radius: 6px; color: var(--text-muted); }
.seg button[aria-pressed="true"] { background: var(--bg-active); color: var(--text-strong); }
.note { padding: 10px 16px 0; color: var(--text-muted); }
.stage { padding: 16px; display: flex; justify-content: center; }

/* ── App frame ── */
.app { position: relative; width: 100%; max-width: 1100px; height: 640px; overflow: hidden; border-radius: 12px; background: var(--bg-base); border: 1px solid var(--border-subtle); display: grid; grid-template-columns: 192px minmax(0, 1fr); grid-template-rows: auto 1fr auto; }
.phone .app { width: 390px; max-width: 390px; height: 760px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; }
header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 16px; }
.wordmark { color: var(--text-strong); }
.hright { display: flex; align-items: center; gap: 4px; position: relative; min-width: 0; }
.ghost { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 10px; border-radius: 6px; color: var(--text-subtle); white-space: nowrap; }
.ghost:hover { background: var(--bg-hover); color: var(--text-muted); }
.ghost.lit { background: var(--bg-hover); color: var(--text-primary); }
.ico { width: 16px; height: 16px; flex: none; }
.rail { display: flex; flex-direction: column; gap: 4px; padding: 16px 4px 8px 8px; }
.phone .rail { flex-direction: row; overflow-x: auto; padding: 0 8px 8px; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; color: var(--text-muted); text-decoration: none; white-space: nowrap; }
.rail a.on { background: color-mix(in oklab, var(--bg-active) 60%, transparent); color: var(--text-strong); }
.panel { background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: 10px; margin: 0 16px 0 0; padding: 24px 28px; overflow: hidden; }
.phone .panel { margin: 0 8px; padding: 18px 16px; }
.panel h1 { margin: 0 0 18px; color: var(--text-strong); }
.row { display: grid; grid-template-columns: 90px 1fr 110px 90px; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border-grid); }
.phone .row { grid-template-columns: 1fr auto; }
.phone .row .hide { display: none; }
.amt { text-align: right; color: var(--text-strong); }
.badge { justify-self: start; padding: 2px 8px; border-radius: 999px; background: var(--accent-muted); color: var(--accent-default); }
.badge.out { background: var(--bg-active); color: var(--text-muted); }
.dock { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
.dock .ver { width: 176px; color: var(--text-subtle); display: flex; align-items: center; gap: 12px; }
.phone .dock .ver { display: none; }
.dot { width: 8px; height: 8px; border-radius: 99px; background: var(--timer-running); box-shadow: var(--shadow-halo-running); }
.dock .task { color: var(--text-primary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock .t { color: var(--text-strong); }


/* ── The form ── */
.scrim { position: absolute; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 10; }
.dlg { min-width: 0; width: 440px; max-width: calc(100% - 32px); background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 12px; box-shadow: var(--shadow-float); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.dlg h2 { margin: 0; color: var(--text-strong); }
.dlg p { margin: 0; color: var(--text-muted); }
textarea { width: 100%; min-height: 128px; resize: vertical; border-radius: 8px; border: 1px solid var(--border-control); background: var(--bg-primary); color: var(--text-primary); padding: 10px 12px; font: inherit; }
textarea:focus { outline: 2px solid var(--border-focus); outline-offset: 1px; }
.ctx { color: var(--text-subtle); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.btns { display: flex; gap: 8px; }
.btn { border-radius: 6px; padding: 8px 14px; border: 1px solid var(--border-default); background: none; color: var(--text-primary); display: inline-flex; align-items: center; gap: 8px; }
.btn.pri { background: var(--accent-default); border-color: var(--accent-default); color: var(--text-on-accent); }
.btn[disabled] { opacity: .55; cursor: default; }
.spin { width: 12px; height: 12px; border-radius: 99px; border: 2px solid currentColor; border-right-color: transparent; animation: s .8s linear infinite; }
@keyframes s { to { transform: rotate(1turn); } }
.err { color: var(--danger); }
.sent { display: flex; gap: 12px; align-items: flex-start; }
.sent .ok { color: var(--success); }
.toast { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 8px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-float); color: var(--text-primary); white-space: nowrap; }
</style>
</head>
<body>
<div class="bar">
  <div class="seg" id="states"></div>
  <div class="seg" id="dev"><button data-v="desk" aria-pressed="true" class="type-meta">Desktop</button><button data-v="phone" class="type-meta">Phone</button></div>
  <div class="seg" id="theme"><button data-v="dark" aria-pressed="true" class="type-meta">Dark</button><button data-v="light" class="type-meta">Light</button></div>
</div>
<div class="note type-support" id="note"></div>
<div class="stage" id="stage"></div>

<script>
const I = {
  msg: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  user: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  check: '<svg class="ico ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>',
  nav: ['Home','Calendar','Clients','Invoices','Settings'],
};
const NOTE = 'A Feedback button beside the account in the header opens the form as a dialog, on every screen and every width.';
const STATES = ['Closed','Open','Typing','Sending','Sent','Failed'];
let st = 'Typing', dev = 'desk';

const TEXT = 'The Northwind invoice total looks $150 short of what Home says I earned in September. Maybe the Rush project rate?';

function form() {
  const typed = st !== 'Open';
  const len = typed ? TEXT.length : 0;
  const sending = st === 'Sending';
  return `<div class="dlg" role="dialog">
    <h2 class="type-heading">Send feedback</h2>
    <p class="type-support">A fault, a question or something you wish it did. It goes straight to us.</p>
    <textarea class="type-body" placeholder="What's in your way?" ${sending ? 'readonly' : ''}>${typed ? TEXT : ''}</textarea>
    ${st === 'Failed' ? `<p class="type-support err">Couldn't send. Your message is still here. Try again.</p>` : ''}
    <div class="foot">
      <span class="type-meta ctx">${len.toLocaleString('en-US')} / 2,000 · Sent with this screen and version</span>
      <div class="btns">
        <button class="btn type-control" ${sending ? 'disabled' : ''}>Cancel</button>
        <button class="btn pri type-control" ${!typed || sending ? 'disabled' : ''}>${sending ? '<span class="spin"></span>Sending' : 'Send'}</button>
      </div>
    </div>
  </div>`;
}
const sentToast = () => `<div class="toast type-body">${I.check}Thanks. Feedback sent.</div>`;

function overlay() {
  if (st === 'Closed') return '';
  if (st === 'Sent') return sentToast();
  return `<div class="scrim">${form()}</div>`;
}

function render() {
  const phone = dev === 'phone';
  const fbBtn = `<button class="ghost type-meta ${st !== 'Closed' && st !== 'Sent' ? 'lit' : ''}">${I.msg}Feedback</button>`;
  const header = `<header>
      <span class="type-wordmark-small wordmark">stint</span>
      <div class="hright">
        ${fbBtn}
        <button class="ghost type-meta">${I.user}<span style="overflow:hidden;text-overflow:ellipsis">${phone ? '' : 'blake@runstint.com'}</span></button>
      </div></header>`;
  const rail = `<nav class="rail type-label">${I.nav.map(n => `<a class="${n==='Invoices'?'on':''}">${n}</a>`).join('')}</nav>`;
  const rows = [
    ['#0014','Northwind Trading','Sep 1–30','$9,450.00','Sent'],
    ['#0013','Meridian Labs','Sep 1–30','$4,180.00','Paid'],
    ['#0012','Byrne Studio','Aug 1–31','$2,970.00','Paid'],
    ['#0011','Northwind Trading','Aug 1–31','$8,820.00','Paid'],
  ].map(r => `<div class="row type-body"><span class="type-meta hide">${r[0]}</span><span>${r[1]}<br><span class="type-meta" style="color:var(--text-subtle)">${r[2]}</span></span><span class="badge type-badge hide ${r[4]==='Sent'?'out':''}">${r[4]}</span><span class="amt type-amount">${r[3]}</span></div>`).join('');
  const panel = `<main class="panel"><h1 class="type-title">Invoices</h1>${rows}</main>`;
  const dock = `<div class="dock"><span class="ver type-meta">0.1.0-alpha.3</span><span class="dot"></span><span class="task type-body">Warehouse dashboard · Fix the export filter</span><span class="t type-timer" style="font-size:18px">1:42:08</span></div>`;
  document.getElementById('stage').className = 'stage ' + (phone ? 'phone' : '');
  document.getElementById('stage').innerHTML = `<div class="app">${header}${rail}${panel}${dock}${overlay()}</div>`;
  document.getElementById('note').textContent = NOTE;
  sync();
}
function seg(id, items, cur, set) {
  const el = document.getElementById(id);
  el.innerHTML = items.map(([k, l]) => `<button class="type-meta" data-v="${k}" aria-pressed="${k===cur}">${l}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (b) { set(b.dataset.v); render(); } };
}
function sync() {
  seg('states', STATES.map(s => [s, s]), st, x => st = x);
  for (const id of ['dev','theme']) document.querySelectorAll(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === (id==='dev'?dev:document.documentElement.dataset.theme)));
}
document.getElementById('dev').onclick = e => { const b = e.target.closest('button'); if (b) { dev = b.dataset.v; render(); } };
document.getElementById('theme').onclick = e => { const b = e.target.closest('button'); if (b) { document.documentElement.dataset.theme = b.dataset.v; render(); } };
render();
</script>
</body>
</html>
