<body>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font-sans); }
.bar { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 16px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-recessed); }
.bar div { display: flex; gap: 4px; align-items: center; }
.bar button { background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border-control); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
.bar button[aria-pressed="true"] { color: var(--text-strong); border-color: var(--border-focus); }
.note { padding: 8px 16px 0; color: var(--text-subtle); }
.app { display: flex; min-height: calc(100vh - 90px); margin: 0 auto; }
.rail { width: 200px; flex: none; padding: 20px 14px; border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 4px; }
.rail .nav { padding: 6px 10px; border-radius: 6px; color: var(--text-muted); }
.rail .nav.on { background: var(--bg-active); color: var(--text-strong); }
main { flex: 1; min-width: 0; padding: 20px 28px; }
.back { color: var(--text-muted); }
h1 { margin: 6px 0 20px; }
.pair { display: grid; grid-template-columns: 360px minmax(0, 560px); gap: 40px; }
.form > * { border-top: 1px solid var(--border-subtle); padding: 20px 0; }
.form > *:first-child { border: 0; padding-top: 4px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.input { border: 1px solid var(--border-control); background: var(--bg-elevated); border-radius: 6px; padding: 7px 10px; min-width: 150px; color: var(--text-primary); }
.input.moved { border-color: var(--border-focus); }
.offer { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 10px 0 0; }
.offer.warn { color: var(--warning); }
.link { color: var(--text-strong); text-decoration: underline; text-underline-offset: 2px; }
.btn { background: var(--bg-elevated); color: var(--text-strong); border: 1px solid var(--border-control); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.btn.primary { background: var(--accent-default); color: var(--text-on-accent); border: 0; padding: 8px 14px; }
.notices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.card { background: var(--print-ground); color: var(--print-ink); border-radius: 8px; box-shadow: var(--shadow-card); padding: 28px; }
.card .muted { color: var(--print-muted); }
.card table { width: 100%; border-collapse: collapse; margin-top: 16px; }
.card td { padding: 6px 0; border-top: 1px solid var(--print-hairline); }
.card td + td { text-align: right; white-space: nowrap; padding-left: 16px; }
.card .new td { color: var(--print-accent); }
body.phone .app { max-width: 390px; }
body.phone .rail { display: none; }
body.phone main { padding: 16px; }
body.phone .pair { grid-template-columns: 1fr; gap: 24px; }
</style>
<div class="bar">
  <div><span class="type-label">State</span><span id="states"></span></div>
  <div><span class="type-label">Variation</span><span id="vars"></span></div>

</div>

<div class="app">
  <nav class="rail">
    <span class="type-wordmark" style="padding:0 10px 12px">Stint</span>
    <span class="nav type-nav">Today</span><span class="nav type-nav">Week</span><span class="nav type-nav">Clients</span>
    <span class="nav type-nav on">Invoices</span><span class="nav type-nav">Settings</span>
  </nav>
  <main>

      <div class="form">

            <div class="field"><span class="type-label">From</span><span class="input type-control" id="from"></span></div>
            <div class="field"><span class="type-label">To</span><span class="input type-control">Oct 31, 2026</span></div>
          </div>
          <div id="slotB"></div>
        </div>
        <div class="field"><span class="type-label">Show time as</span><span class="input type-control">Every entry</span></div>
        <div><button class="btn primary type-control">Generate invoice</button></div>
      </div>
      <div>
        <div class="notices" id="slotA"></div>
        <div class="card">
          <div class="type-heading">INV-0043</div>
          <div class="type-support muted" id="period"></div>
          <table class="type-body" id="lines"></table>
          <p class="type-amount" style="text-align:right;margin:16px 0 0" id="total"></p>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
const STATES = {
  none: 'No earlier work',
  one: 'One earlier entry',
  many: 'Several earlier entries',
  held: 'Held by a draft',
  included: 'After Include',
};
const VARS = {
  A: ['Above the preview', 'Beside the other things the preview warns about, where the issue puts it. Costs: Include moves a field on the other side of the screen.'],
  B: ['Under the dates', 'Next to the date it moves, so the change is seen where it lands. Costs: the form, not the preview, tells her what will be billed.'],
};
let state = 'one', variation = 'A';
const LINES = [
  ['Sep 30 · Warehouse dashboard: fix picker', '2.50 h', '$375.00', 'sep'],
  ['Oct 2 · Warehouse dashboard', '6.00 h', '$900.00'],
  ['Oct 9 · Rush: peak season fixes', '7.25 h', '$1,087.50'],
  ['Oct 21 · Warehouse dashboard', '5.50 h', '$825.00'],
];
function offer() {
  if (state === 'one') return ['', '1 earlier entry, Sep 30, isn’t on any invoice.', 'Include it'];
  if (state === 'many') return ['', '3 earlier entries, Sep 28 – Sep 30, aren’t on any invoice.', 'Include them'];
  if (state === 'held') return ['warn', '1 earlier entry, Sep 30, is on draft <a class="link" href="#">INV-0042</a>. Open that draft to bill it.', null];
  return null;
}
function render() {
  document.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === state));
  document.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === variation));
  document.getElementById('varnote').textContent = VARS[variation][0] + ': ' + VARS[variation][1];
  const included = state === 'included';
  const start = included ? 'Sep 30, 2026' : 'Oct 1, 2026';
  const from = document.getElementById('from');
  from.textContent = start; from.classList.toggle('moved', included);
  document.getElementById('period').textContent = 'Northwind Trading · ' + start.replace(', 2026', '') + ' – Oct 31, 2026';
  const lines = LINES.filter(l => included || !l[3]);
  document.getElementById('lines').innerHTML = lines.map(l => `<tr class="${l[3] && included ? 'new' : ''}"><td>${l[0]}</td><td>${l[1]}</td><td>${l[2]}</td></tr>`).join('');
  document.getElementById('total').textContent = included ? '$3,187.50' : '$2,812.50';
  const o = offer();
  const html = o ? `<p class="offer type-support ${o[0]}" role="status"><span>${o[1]}</span>${o[2] ? `<button class="btn type-control" data-include>${o[2]}</button>` : ''}</p>` : '';
  document.getElementById('slotA').innerHTML = variation === 'A' ? html : '';
  document.getElementById('slotB').innerHTML = variation === 'B' ? html : '';
  document.querySelectorAll('[data-include]').forEach(b => b.onclick = () => { state = 'included'; render(); });
}
document.getElementById('states').innerHTML = Object.entries(STATES).map(([k, v]) => `<button data-s="${k}">${v}</button>`).join('');
document.getElementById('vars').innerHTML = Object.entries(VARS).map(([k, v]) => `<button data-v="${k}">${k}: ${v[0]}</button>`).join('');
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { state = b.dataset.s; render(); });
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { variation = b.dataset.v; render(); });
document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { document.body.classList.toggle('phone', b.dataset.w === 'phone'); document.querySelectorAll('[data-w]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { document.documentElement.dataset.theme = b.dataset.t; document.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
render();
</script>
</body>
