name: CI

on:
  push: { branches: [main] }
  pull_request:

# The suite spins up five databases; a second push should supersede the
# first rather than run it all twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads code. Anything that needs more
# asks for it on the job.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tt
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7
      # No `version:` — package.json's `packageManager` pins it, and setting
      # both makes the action fail on a version mismatch.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: 'pnpm' }

      - run: pnpm install --frozen-lockfile

      # Formatting and lint. Fast enough to run first, so an obvious slip
      # fails in seconds rather than after five databases have spun up.
      - name: Lint
        run: pnpm lint

      # Generated token files must match tokens.json. A hand-edit to dist/
      # fails here rather than drifting silently across three clients.
      - name: Design tokens are up to date
        run: |
          node packages/design-tokens/src/generate.js
          git diff --exit-code packages/design-tokens/dist

      # Guards the white-on-accent regression (1.37:1) and the AA floors.
      - name: Contrast contract
        run: node packages/design-tokens/src/validate.js

      # Vendored shadcn components are rewritten to our tokens at install.
      # This is the only enforcement: Tailwind 4 drops an unknown utility
      # with no warning and exit 0, so a surviving `bg-primary` would render
      # our neutral grey on a primary button and never fail the build.
      - name: shadcn components use our tokens
        run: cd apps/web && node scripts/shadcn-detox.mjs --check 'src/components/ui/*.tsx'

      - name: Typecheck
        run: |
          npx tsc --noEmit -p tsconfig.json
          cd apps/web && npx tsc --noEmit

      # Component tests: jsdom, no database. The route/RLS suites below run
      # under `node --test` against real Postgres and are separate.
      - name: UI component tests
        run: cd apps/web && pnpm test:ui

      - name: Core logic tests
        run: node --test --experimental-strip-types packages/core/test/*.test.ts

      # Applies the real migrations, then runs the real route handlers
      # against them — so the timer index and immutability triggers are
      # genuinely exercised, not mocked.
      - name: Apply migrations
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -d tt -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table auth.users (id uuid primary key default gen_random_uuid(), email text);
          create or replace function auth.uid() returns uuid language sql stable as
            $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          -- Supabase ships these; the grants migration needs them to exist.
          -- Roles are CLUSTER-wide, so the RLS database below must not
          -- recreate them — it only upgrades `authenticated` to log in.
          create role anon nologin;
          create role authenticated nologin;
          SQL
          for f in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d tt -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d tt -c "
            alter table user_settings disable row level security;
            alter table clients disable row level security;
            alter table projects disable row level security;
            alter table invoices disable row level security;
            alter table time_entries disable row level security;
            alter table invoice_line_items disable row level security;
            alter table payment_profiles disable row level security;"

      - name: API route tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tt
        run: cd apps/web && pnpm test

      # A SEPARATE database, because the route tests above disable RLS on
      # theirs. Here RLS stays on and the caller is a non-superuser role, so
      # auth.uid() resolves and the policies actually run.
      - name: Set up the RLS database
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -c 'create database tt_rls'
          psql -h localhost -U postgres -d tt_rls -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table auth.users (id uuid primary key default gen_random_uuid(), email text);
          create or replace function auth.uid() returns uuid language sql stable as
            $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          -- anon/authenticated already exist from the first database: roles
          -- are cluster-wide, and re-creating them fails the step.
          --
          -- `authenticated` mirrors the role PostgREST uses for a signed-in
          -- caller, so it needs to log in here — NOT a superuser and NOT
          -- BYPASSRLS, or every assertion passes vacuously.
          alter role authenticated login password 'test';
          SQL
          for f in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -d tt_rls -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -h localhost -U postgres -d tt_rls -v ON_ERROR_STOP=1 <<'SQL'
          grant usage on schema public, auth to authenticated;
          grant select on auth.users to authenticated;
          grant execute on all functions in schema public, auth to authenticated;
          -- Table privileges come from 00000000000004_api_grants.sql, not from
          -- here: granting them ad-hoc would hide a broken grants migration.
          SQL

      - name: RLS tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tt_rls
          RLS_DATABASE_URL: postgresql://authenticated:test@localhost:5432/tt_rls
        run: cd apps/web && pnpm test:rls

      # The same assertions that gate a production release, run here against
      # the RLS database — the one where RLS is still ON. Catches a migration
      # that creates a table without RLS, or with RLS but no policy, before
      # it can reach a real project.
      - name: Schema is sound
        run: pnpm verify:schema --url postgresql://postgres:postgres@localhost:5432/tt_rls

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
        run: cd apps/web && pnpm build
