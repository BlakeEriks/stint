# Prose linting for docs/ and the CLAUDE.md files: the Google developer
# documentation style guide, plus Stint's house rules from docs/CLAUDE.md.
# `vale sync` downloads Google into .vale/styles (gitignored); Stint is ours.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = Google

[{docs/**/*.{md,html},CLAUDE.md}]
BasedOnStyles = Vale, Google, Stint

# Identifiers and product names fill these docs; a dictionary check flags
# every one of them.
Vale.Spelling = NO
# House style spaces the em dash — like this.
Google.EmDash = NO
# `96px`, `500ms` are CSS and config values, written as the code writes them.
Google.Units = NO
# The docs speak as the team ("what we believe"), and the rule also reads
# "US" as the pronoun.
Google.We = NO

# Code: comments only, and only for spelling.
[{apps,packages,scripts,supabase}/**/*.{ts,tsx,js,mjs,swift,sql,css}]
Stint.American = YES
